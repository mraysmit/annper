<!doctype html>
<html lang="en-GB" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>annper Workspace</title>
  <style>
    :root {
      color-scheme: light;
      --nav-width: 272px;
      --bg: #f3f5f8;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --surface-3: #eef2f6;
      --text: #172033;
      --muted: #5b667c;
      --line: #cbd4e0;
      --line-strong: #8f9bb0;
      --brand: #3152c8;
      --brand-dark: #233f9f;
      --brand-soft: #e8edff;
      --on-brand: #ffffff;
      --accent: #067a67;
      --warning: #9a5b0b;
      --warning-soft: #fff4dc;
      --danger: #b3283a;
      --danger-soft: #fdecee;
      --on-danger: #ffffff;
      --success: #136f4e;
      --success-soft: #e4f6ee;
      --info-soft: #e8edff;
      --focus: #1d4fd8;
      --toast-bg: #172033;
      --toast-fg: #ffffff;
      --shadow: 0 10px 30px rgba(28, 39, 64, .09);
      --shadow-soft: 0 2px 10px rgba(28, 39, 64, .07);
      --radius: 12px;
      --header-h: 64px;
      --tabs-h: 43px;
      --font: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #10141d;
      --surface: #171d28;
      --surface-2: #1d2532;
      --surface-3: #273141;
      --text: #ecf1f8;
      --muted: #a9b4c7;
      --line: #3a465a;
      --line-strong: #6b7a93;
      --brand: #8ea8ff;
      --brand-dark: #b4c4ff;
      --brand-soft: #29365d;
      --on-brand: #0c1330;
      --accent: #49d5b7;
      --warning: #f3b65a;
      --warning-soft: #3a2f17;
      --danger: #ff8d9a;
      --danger-soft: #40212a;
      --on-danger: #2a0a10;
      --success: #5fdcaa;
      --success-soft: #173528;
      --info-soft: #29365d;
      --focus: #a9bcff;
      --toast-bg: #2b3650;
      --toast-fg: #f4f7fc;
      --shadow: 0 12px 34px rgba(0, 0, 0, .26);
      --shadow-soft: 0 2px 12px rgba(0, 0, 0, .22);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.45; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button, select { cursor: pointer; }
    button:disabled { cursor: not-allowed; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .skip-link { position: fixed; z-index: 2000; left: 10px; top: -60px; background: var(--text); color: var(--surface); padding: 10px 14px; border-radius: 6px; }
    .skip-link:focus { top: 8px; }
    .sr-only { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
    .hidden { display: none !important; }
    h1, h2, h3 { margin: 0; }

    #app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) 28px; }
    .topbar { min-height: var(--header-h); display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--line); z-index: 20; }
    .brand { display: flex; align-items: center; gap: 10px; border: 1px solid transparent; background: transparent; padding: 4px 6px; margin-left: -6px; border-radius: 10px; text-align: left; }
    .brand:hover:not(:disabled) { background: var(--surface-2); border-color: var(--line-strong); }
    .brand-mark { width: 34px; height: 34px; flex: none; display: grid; place-items: center; border-radius: 9px; color: #fff; background: linear-gradient(145deg, #2f4fc4, #06806c); font-weight: 700; letter-spacing: -.04em; }
    .brand-copy { line-height: 1.15; }
    .brand-copy strong { display: block; font-size: 14px; font-weight: 650; }
    .brand-copy span { color: var(--muted); font-size: 11px; }
    .app-picker { position: relative; min-width: 190px; }
    .app-picker select { width: 100%; appearance: none; background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 32px 8px 12px; font-weight: 600; }
    .app-picker::after { content: "▾"; position: absolute; right: 12px; top: 8px; color: var(--muted); pointer-events: none; }
    .conn { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); padding: 4px 9px; border: 1px solid var(--line); border-radius: 20px; white-space: nowrap; }
    .conn.lost { color: var(--danger); border-color: var(--danger); background: var(--danger-soft); font-weight: 650; }
    .topbar-spacer { flex: 1 1 0; }
    .global-commands { display: flex; align-items: center; gap: 2px; }
    .shell-button { min-height: 36px; border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 0 9px; display: inline-flex; align-items: center; gap: 6px; position: relative; white-space: nowrap; }
    .shell-button:hover { background: var(--surface-3); border-color: var(--line-strong); }
    .shell-button .glyph { width: 18px; text-align: center; }
    .count-badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 10px; display: inline-grid; place-items: center; background: var(--danger); color: var(--on-danger); font-size: 10px; font-weight: 700; }
    .user-button { display: flex; gap: 9px; align-items: center; background: transparent; border: 1px solid transparent; padding: 3px 8px; border-radius: 8px; min-height: 36px; }
    .user-button:hover { background: var(--surface-3); border-color: var(--line-strong); }
    .avatar { width: 30px; height: 30px; flex: none; border-radius: 50%; background: var(--brand-soft); color: var(--brand-dark); display: grid; place-items: center; font-size: 12px; font-weight: 750; }
    .user-copy { text-align: left; line-height: 1.2; }
    .user-copy strong { display: block; font-size: 12px; }
    .user-copy span { color: var(--muted); font-size: 10px; }
    .menu { position: fixed; z-index: 90; min-width: 230px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: var(--shadow); padding: 6px; }
    .menu button { width: 100%; display: flex; gap: 10px; align-items: center; border: 0; background: transparent; border-radius: 7px; padding: 9px 10px; text-align: left; min-height: 38px; }
    .menu button:hover, .menu button:focus-visible { background: var(--brand-soft); }
    .menu hr { border: 0; border-top: 1px solid var(--line); margin: 5px 0; }

    .body-grid { min-height: 0; display: grid; grid-template-columns: var(--nav-width) 6px minmax(0, 1fr); }
    .sidebar { min-width: 0; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; }
    .sidebar-head { padding: 14px 12px 8px 15px; display: flex; align-items: center; justify-content: space-between; }
    .sidebar-head h2 { font-size: 11px; color: var(--muted); letter-spacing: .09em; text-transform: uppercase; font-weight: 700; }
    .icon-button { border: 1px solid transparent; background: transparent; border-radius: 8px; min-width: 34px; height: 34px; padding: 0 8px; display: inline-grid; place-items: center; }
    .icon-button:hover { background: var(--surface-3); border-color: var(--line-strong); }
    .nav-scroll { overflow: auto; padding: 0 9px 18px; }
    .nav-group { margin: 4px 0 8px; }
    .nav-group h3 { font: inherit; }
    .nav-group ul { list-style: none; margin: 0; padding: 0; }
    .nav-group-title { width: 100%; display: flex; justify-content: space-between; align-items: center; border: 0; background: transparent; color: var(--muted); padding: 9px 8px; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; border-radius: 7px; }
    .nav-group-title .chevron { transition: transform .16s ease; }
    .nav-group-title[aria-expanded="false"] .chevron { transform: rotate(-90deg); }
    .nav-row { display: flex; align-items: center; gap: 2px; margin: 2px 0; }
    .nav-item { flex: 1; min-width: 0; border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 8px 9px; display: flex; align-items: center; gap: 10px; color: var(--text); text-align: left; }
    .nav-item:hover { background: var(--surface-2); border-color: var(--line); }
    .nav-item[aria-current="page"] { background: var(--brand-soft); color: var(--brand-dark); font-weight: 650; border-left: 3px solid var(--brand); }
    .nav-item .nav-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nav-icon { width: 25px; height: 25px; flex: 0 0 25px; display: grid; place-items: center; border-radius: 7px; background: var(--surface-3); color: var(--text); font-size: 13px; }
    .nav-tool { flex: none; width: 26px; height: 28px; border: 1px solid transparent; background: transparent; border-radius: 6px; color: var(--muted); padding: 0; font-size: 12px; }
    .nav-tool:hover:not(:disabled), .nav-tool:focus-visible { background: var(--surface-3); color: var(--text); border-color: var(--line-strong); }
    .nav-tool:disabled { opacity: .35; }
    .nav-tool[aria-pressed="true"] { color: var(--brand-dark); }
    .nav-empty { color: var(--muted); font-size: 12px; padding: 4px 10px 8px; }
    .sidebar-footer { margin-top: auto; border-top: 1px solid var(--line); padding: 10px 14px; color: var(--muted); font-size: 11px; }
    .sidebar.collapsed .nav-label, .sidebar.collapsed .nav-tool, .sidebar.collapsed .nav-group-title .group-text,
    .sidebar.collapsed .sidebar-footer, .sidebar.collapsed .sidebar-head h2, .sidebar.collapsed .nav-empty { display: none; }
    .sidebar.collapsed .nav-item { justify-content: center; padding-inline: 5px; }
    .sidebar.collapsed .nav-group-title { justify-content: center; }
    .sidebar.collapsed .sidebar-head { justify-content: center; padding-inline: 4px; }
    .splitter { cursor: col-resize; position: relative; background: var(--bg); touch-action: none; }
    .splitter:hover, .splitter.dragging, .splitter:focus-visible { background: var(--brand-soft); }
    .splitter::after { content: ""; position: absolute; width: 2px; height: 34px; background: var(--line-strong); border-radius: 2px; left: 2px; top: calc(50% - 17px); }
    .nav-backdrop { display: none; }

    .workspace { min-width: 0; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: var(--tabs-h) minmax(0, 1fr); position: relative; }
    .tabs { display: flex; align-items: stretch; gap: 2px; padding: 0 10px; overflow-x: auto; background: var(--surface); border-bottom: 1px solid var(--line); }
    .tab-wrap { display: flex; align-items: center; border-bottom: 3px solid transparent; }
    .tab-wrap.active { border-bottom-color: var(--brand); }
    .tab { align-self: stretch; max-width: 240px; display: flex; align-items: center; gap: 7px; border: 0; background: transparent; padding: 0 8px 0 10px; color: var(--muted); white-space: nowrap; }
    .tab:hover { color: var(--text); }
    .tab[aria-selected="true"] { color: var(--text); font-weight: 650; }
    .tab-label { overflow: hidden; text-overflow: ellipsis; }
    .tab-flag { font-size: 11px; font-weight: 700; }
    .tab-flag.dirty { color: var(--warning); }
    .tab-flag.error { color: var(--danger); }
    .tab-flag.attention { color: var(--warning); }
    .tab-close { border: 1px solid transparent; background: transparent; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 6px; color: var(--muted); padding: 0; }
    .tab-close:hover { background: var(--surface-3); color: var(--text); border-color: var(--line-strong); }
    .tabs-empty { padding: 0 8px; align-self: center; color: var(--muted); }
    .screen-host { min-height: 0; overflow: auto; padding: 18px; }
    .screen { max-width: 1600px; margin: 0 auto; }
    .screen-heading { display: flex; align-items: flex-start; gap: 15px; margin-bottom: 14px; flex-wrap: wrap; }
    .screen-heading h1 { font-size: 22px; line-height: 1.2; font-weight: 650; letter-spacing: -.02em; }
    .screen-heading p { margin: 4px 0 0; color: var(--muted); }
    .heading-actions { margin-left: auto; display: flex; gap: 7px; flex-wrap: wrap; }

    .toolbar { background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 7px; box-shadow: var(--shadow-soft); display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin-bottom: 14px; }
    .tool-button { min-height: 36px; border: 1px solid transparent; border-radius: 7px; background: transparent; padding: 6px 10px; display: inline-flex; align-items: center; gap: 7px; color: var(--text); }
    .tool-button:hover:not(:disabled) { background: var(--surface-3); border-color: var(--line-strong); }
    .tool-button.primary { background: var(--brand); color: var(--on-brand); font-weight: 600; }
    .tool-button.primary:hover:not(:disabled) { background: var(--brand-dark); }
    .tool-button.danger { color: var(--danger); }
    .tool-button[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-dark); }
    .tool-button:disabled { opacity: .5; }
    .inline-control { color: var(--muted); font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
    .inline-control select { border: 1px solid var(--line-strong); background: var(--surface-2); border-radius: 7px; padding: 6px 8px; color: var(--text); }
    .state-chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); border-radius: 20px; padding: 4px 10px; font-size: 12px; background: var(--surface-2); }
    .state-chip.paused { border-style: dashed; color: var(--warning); }

    .panel { background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius); box-shadow: var(--shadow-soft); }
    .panel-head { min-height: 48px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .panel-head h2, .panel-head h3 { font-size: 14px; font-weight: 650; }
    .panel-head .meta { margin: 0 0 0 auto; color: var(--muted); font-size: 12px; }
    .panel-body { padding: 15px; }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(130px, 1fr)); gap: 12px; margin-bottom: 14px; }
    .stat { padding: 14px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; }
    .stat span { color: var(--muted); font-size: 12px; }
    .stat strong { display: block; margin-top: 5px; font-size: 20px; letter-spacing: -.02em; }
    .stat em { font-style: normal; font-size: 11px; color: var(--muted); }

    .criteria-panel { background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; }
    .criteria-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; align-items: end; }
    .criteria-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; margin-top: 12px; }
    .search-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 14px; }
    .search-bar input { flex: 1 1 200px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 8px 10px; }
    .field { min-width: 0; }
    .field label, .field .field-label { display: block; color: var(--muted); font-size: 12px; font-weight: 650; margin: 0 0 5px; }
    .field input:not([type="checkbox"]), .field select, .field textarea { width: 100%; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 9px 10px; }
    .field textarea { min-height: 88px; resize: vertical; }
    .field input:disabled, .field select:disabled, .field textarea:disabled { background: var(--surface-3); color: var(--muted); }
    .field [aria-invalid="true"] { border-color: var(--danger); border-width: 2px; }
    .field-error { color: var(--danger); font-size: 12px; margin-top: 4px; font-weight: 600; }
    .field-help { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .readonly-value { padding: 9px 0; font-weight: 550; min-height: 38px; }
    .static-text { grid-column: 1 / -1; color: var(--muted); border-left: 3px solid var(--line-strong); padding: 6px 10px; margin: 0; }
    .lookup-wrap { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
    .lookup-button { border: 1px solid var(--line-strong); background: var(--surface-2); border-radius: 8px; padding: 0 12px; min-height: 38px; }
    .lookup-button:hover:not(:disabled) { background: var(--brand-soft); }
    .check-row { display: flex !important; align-items: center; gap: 8px; min-height: 38px; color: var(--text) !important; font-size: 14px !important; font-weight: 400 !important; margin: 0 !important; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px 18px; }
    .form-grid .wide { grid-column: 1 / -1; }
    .form-grid fieldset { display: contents; }
    .summary { border-left: 4px solid var(--brand); background: var(--info-soft); padding: 10px 12px; margin-bottom: 14px; border-radius: 0 8px 8px 0; }
    .summary.error { border-left-color: var(--danger); background: var(--danger-soft); }
    .summary ul { margin: 6px 0 0; padding-left: 18px; }
    .summary a { color: inherit; font-weight: 600; }

    .banner { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--line-strong); border-left-width: 5px; border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; background: var(--surface); }
    .banner.warning { border-color: var(--warning); background: var(--warning-soft); }
    .banner.error { border-color: var(--danger); background: var(--danger-soft); }
    .banner.info { border-color: var(--brand); background: var(--info-soft); }
    .banner-icon { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; border: 2px solid currentColor; }
    .banner h2 { font-size: 14px; }
    .banner p { margin: 3px 0 0; }
    .banner dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 8px 0 0; font-size: 12px; }
    .banner dt { color: var(--muted); }
    .banner dd { margin: 0; font-family: ui-monospace, Consolas, monospace; }
    .banner-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .state-panel { max-width: 620px; margin: 40px auto; text-align: center; padding: 34px 26px; }
    .state-panel .state-icon { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 12px; font-size: 24px; font-weight: 800; border: 3px solid currentColor; color: var(--muted); }
    .state-panel.error .state-icon { color: var(--danger); }
    .state-panel h2 { font-size: 18px; }
    .state-panel p { color: var(--muted); margin: 8px 0 0; }
    .state-panel .ref { font-family: ui-monospace, Consolas, monospace; font-size: 12px; margin-top: 12px; }
    .state-panel .banner-actions { justify-content: center; margin-top: 18px; }
    .skeleton-line { height: 14px; border-radius: 6px; background: var(--surface-3); margin: 12px 0; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .45; } }
    .busy-note { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
    .spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--brand); animation: spin .8s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .unreachable { position: absolute; inset: var(--tabs-h) 0 0 0; z-index: 15; background: color-mix(in srgb, var(--bg) 88%, transparent); display: grid; place-items: center; padding: 20px; }
    .unreachable .panel { max-width: 520px; text-align: center; padding: 28px 24px; }

    .table-wrap { overflow: auto; max-height: max(340px, calc(100vh - 380px)); border-radius: 0 0 var(--radius) var(--radius); }
    table { width: 100%; border-collapse: collapse; min-width: 760px; }
    table.compact { min-width: 0; }
    th, td { border-bottom: 1px solid var(--line); padding: 9px 12px; text-align: left; vertical-align: middle; }
    thead th { position: sticky; top: 0; z-index: 2; background: var(--surface-2); color: var(--muted); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; font-weight: 700; white-space: nowrap; }
    thead th button { border: 0; background: transparent; padding: 2px 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; display: inline-flex; gap: 5px; align-items: center; }
    thead th .sort-mark { color: var(--text); }
    tbody tr { background: var(--surface); }
    tbody tr:hover { background: var(--surface-2); }
    tbody tr.selected { background: var(--brand-soft); }
    tbody tr.match-current { outline: 2px solid var(--focus); outline-offset: -2px; }
    tbody th[scope="row"] { font-weight: 600; white-space: nowrap; }
    td.nowrap { white-space: nowrap; }
    td.number, th.number { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .row-check { width: 40px; text-align: center; }
    .row-check input { width: 18px; height: 18px; }
    .group-row th { background: var(--surface-3); font-weight: 650; text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--text); position: static; }
    .row-tag { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; background: var(--success-soft); color: var(--success); border: 1px solid currentColor; }
    .row-error { color: var(--danger); font-size: 12px; font-weight: 600; margin-top: 3px; }
    .cell-input { width: 92px; border: 1px solid var(--line-strong); border-radius: 6px; padding: 6px; text-align: right; background: var(--surface); }
    .cell-input[aria-invalid="true"] { border-color: var(--danger); border-width: 2px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 20px; padding: 2px 9px; font-size: 12px; font-weight: 600; background: var(--surface-3); border: 1px solid var(--line-strong); white-space: nowrap; }
    .chip .mark { font-size: 10px; }
    .chip.positive { background: var(--success-soft); color: var(--success); border-color: currentColor; }
    .chip.caution { background: var(--warning-soft); color: var(--warning); border-color: currentColor; }
    .chip.critical { background: var(--danger-soft); color: var(--danger); border-color: currentColor; }
    .retained { font-style: italic; }
    .empty-state { padding: 46px 20px; text-align: center; color: var(--muted); }
    .empty-state strong { display: block; color: var(--text); margin-bottom: 5px; }
    .table-footer { padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
    .pager { display: inline-flex; gap: 6px; align-items: center; }

    .master-detail { display: grid; grid-template-columns: minmax(240px, .7fr) minmax(0, 1.5fr); gap: 14px; align-items: start; }
    .master-list { list-style: none; padding: 8px; margin: 0; }
    .master-list button { width: 100%; padding: 10px 11px; border: 1px solid transparent; border-left: 4px solid transparent; background: transparent; border-radius: 8px; text-align: left; }
    .master-list button:hover { background: var(--surface-2); border-color: var(--line); }

    .action-layout { display: grid; grid-template-columns: minmax(320px, .8fr) minmax(0, 1.2fr); gap: 14px; align-items: start; }

    .result-lines dt { color: var(--muted); }
    .result-lines dd { margin: 0; font-weight: 600; }
    .progress { height: 10px; border-radius: 6px; background: var(--surface-3); overflow: hidden; margin: 12px 0; border: 1px solid var(--line-strong); }
    .progress > span { display: block; height: 100%; background: var(--brand); transition: width .2s ease; }
    .form-actions { margin-top: 16px; display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; grid-column: 1 / -1; }

    .tree-detail { display: grid; grid-template-columns: minmax(250px, .65fr) minmax(0, 1.35fr); gap: 14px; align-items: start; }
    .tree { padding: 10px 12px; min-height: 320px; }

    .tree-twist { width: 18px; text-align: center; color: var(--muted); flex: none; }
    .detail-list { margin: 0; }
    .detail-kv { display: grid; grid-template-columns: 150px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .detail-kv dt { color: var(--muted); }
    .detail-kv dd { margin: 0; font-weight: 550; overflow-wrap: anywhere; }

    .junction-controls { margin-bottom: 14px; display: flex; align-items: end; gap: 12px; flex-wrap: wrap; }
    .junction { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; }
    .pick-list-search { padding: 10px; border-bottom: 1px solid var(--line); }
    .pick-list-search input { width: 100%; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 7px; padding: 8px; }
    .pick-items { list-style: none; margin: 0; max-height: 330px; min-height: 200px; overflow: auto; padding: 7px; }
    .pick-item { display: flex; align-items: center; gap: 9px; border-radius: 7px; padding: 8px 9px; border: 1px solid transparent; }
    .pick-item:hover { background: var(--surface-2); border-color: var(--line); }
    .pick-item input { width: 18px; height: 18px; flex: none; }
    .pick-item .pick-text { flex: 1; min-width: 0; }
    .pick-item small { color: var(--muted); display: block; }
    .pick-item.pending { border-style: dashed; border-color: var(--line-strong); }
    .pick-actions { display: flex; flex-direction: column; gap: 8px; }
    .pick-actions .button { min-width: 44px; }
    .pick-actions .narrow-glyph { display: none; }

    .chart-area { padding: 18px 18px 8px; overflow-x: auto; }
    .chart-area svg { display: block; width: 100%; min-width: 560px; height: auto; max-height: 420px; }
    .chart-grid { stroke: var(--line); stroke-width: 1; }
    .chart-axis { fill: var(--muted); font: 11px var(--font); }
    .bar { fill: var(--brand); }
    .bar.hatched { fill: url(#hatch); stroke: var(--accent); stroke-width: 1.5; }
    .hatch-line { stroke: var(--accent); stroke-width: 3; }
    .bar:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .chart-legend { display: flex; gap: 18px; padding: 0 18px 14px; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
    .legend-swatch { display: inline-block; width: 14px; height: 11px; border-radius: 2px; margin-right: 6px; background: var(--brand); vertical-align: -1px; }
    .legend-swatch.hatched { background: repeating-linear-gradient(45deg, var(--accent) 0 3px, transparent 3px 6px); border: 1.5px solid var(--accent); }

    .welcome { min-height: calc(100% - 10px); display: grid; place-items: center; }
    .welcome-inner { max-width: 820px; text-align: center; }
    .welcome-mark { width: 64px; height: 64px; display: grid; place-items: center; margin: 0 auto 16px; border-radius: 18px; background: linear-gradient(145deg, #2f4fc4, #06806c); color: #fff; font-weight: 750; font-size: 21px; box-shadow: var(--shadow); }
    .welcome h1 { font-size: 28px; letter-spacing: -.03em; }
    .welcome p { color: var(--muted); font-size: 15px; }
    .welcome h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 26px 0 10px; text-align: left; }
    .launch-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; text-align: left; }
    .launch-card { border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow-soft); text-align: left; display: flex; gap: 10px; align-items: flex-start; }
    .launch-card:hover { border-color: var(--brand); background: var(--surface-2); }
    .launch-card strong { display: block; margin-bottom: 3px; }
    .launch-card span.desc { color: var(--muted); font-size: 12px; }

    .statusbar { display: flex; align-items: center; gap: 14px; padding: 0 12px; background: var(--surface); border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; }
    .statusbar .right { margin-left: auto; }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(15, 20, 31, .5); z-index: 100; display: grid; place-items: center; padding: 20px; }
    .modal { width: min(680px, 100%); min-width: 0; max-height: min(780px, 92vh); overflow: hidden; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 14px; box-shadow: 0 24px 70px rgba(0,0,0,.28); display: flex; flex-direction: column; }
    .modal.small { width: min(480px, 100%); }
    .modal.wide { width: min(920px, 100%); }
    .modal-backdrop.drawer { place-items: stretch end; padding: 0; }
    .modal-backdrop.drawer .modal { width: min(430px, 94vw); max-height: none; height: 100%; border-radius: 0; }
    .modal-head { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
    .modal-head h2 { font-size: 17px; min-width: 0; overflow-wrap: anywhere; }
    .modal-head .icon-button { margin-left: auto; }
    .modal-body { padding: 18px; overflow: auto; }
    .modal-body > p:first-child { margin-top: 0; }
    .modal-foot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; }
    .severity { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; border: 2px solid currentColor; }
    .severity.warning { color: var(--warning); }
    .severity.error { color: var(--danger); }
    .severity.information, .severity.question { color: var(--brand); }
    .severity.success { color: var(--success); }
    .modeless-layer { position: fixed; z-index: 95; left: 18px; bottom: 44px; display: flex; flex-direction: column; gap: 10px; width: min(420px, calc(100vw - 36px)); }
    .modeless-layer .modal { width: 100%; box-shadow: var(--shadow); }
    .button { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 8px 13px; min-height: 36px; }
    .button:hover:not(:disabled) { background: var(--surface-3); }
    .button:disabled { opacity: .5; }
    .button.primary { border-color: var(--brand); background: var(--brand); color: var(--on-brand); font-weight: 600; }
    .button.primary:hover:not(:disabled) { background: var(--brand-dark); }
    .button.danger { border-color: var(--danger); background: var(--danger); color: var(--on-danger); font-weight: 600; }
    .button.small { min-height: 30px; padding: 4px 9px; font-size: 12px; }
    a.button { text-decoration: none; display: inline-flex; align-items: center; }
    .linkish { background: none; border: 0; padding: 0; color: inherit; text-decoration: underline; font-weight: 600; text-align: left; }
    .auto-group { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .screen-status { display: flex; justify-content: flex-end; align-items: center; gap: 12px; flex-wrap: wrap; margin: -6px 2px 12px; }
    .button.is-default { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--line-strong); }
    .lookup-results { list-style: none; padding: 0; border: 1px solid var(--line); border-radius: 8px; margin: 10px 0 0; max-height: 300px; overflow: auto; }
    .lookup-result { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: var(--surface); text-align: left; padding: 10px; }
    .lookup-result:hover, .lookup-result:focus-visible { background: var(--brand-soft); }
    .lookup-result strong, .lookup-result span { display: block; }
    .lookup-result span { color: var(--muted); font-size: 12px; }
    .option-list { list-style: none; margin: 0; padding: 0; }
    .option-list li { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .option-list .grow { flex: 1; min-width: 120px; }
    .option-list input[type="number"] { width: 82px; border: 1px solid var(--line-strong); border-radius: 6px; padding: 5px; background: var(--surface); }
    .form-section { margin-top: 18px; }
    .form-section > h3 { font-size: 13px; margin-bottom: 8px; }
    .message { padding: 12px; border: 1px solid var(--line); border-radius: 9px; display: grid; grid-template-columns: 30px 1fr; gap: 10px; margin-bottom: 8px; }
    .message.unread { border-color: var(--brand); border-left-width: 4px; background: var(--info-soft); }
    .message strong { display: block; margin-bottom: 3px; }
    .message p { margin: 0; }
    .message .meta { color: var(--muted); font-size: 12px; margin-top: 6px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .kv { display: grid; grid-template-columns: 170px 1fr; gap: 6px 12px; margin: 0; }
    .kv dt { color: var(--muted); }
    .kv dd { margin: 0; font-weight: 550; overflow-wrap: anywhere; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }

    .notice-region { position: fixed; z-index: 300; right: 18px; bottom: 44px; display: flex; flex-direction: column; gap: 8px; width: min(400px, calc(100vw - 36px)); }
    .notice { background: var(--toast-bg); color: var(--toast-fg); border-radius: 9px; box-shadow: var(--shadow); padding: 10px 12px; display: flex; align-items: flex-start; gap: 9px; border: 1px solid transparent; }
    .notice .notice-mark { flex: none; width: 20px; height: 20px; border-radius: 50%; border: 2px solid currentColor; display: grid; place-items: center; font-size: 11px; font-weight: 800; }
    .notice.warning { border-color: #ffd17e; }
    .notice.warning .notice-mark { color: #ffd17e; }
    .notice.success .notice-mark { color: #7ee8bd; }
    .notice .notice-text { flex: 1; }
    .notice button { border: 1px solid currentColor; background: transparent; color: inherit; border-radius: 6px; padding: 2px 8px; font-size: 12px; min-height: 24px; }
    .job-tray { position: fixed; z-index: 94; right: 18px; top: 76px; width: min(360px, calc(100vw - 36px)); display: flex; flex-direction: column; gap: 8px; }
    .job { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: var(--shadow); padding: 12px; }
    .job h3 { font-size: 13px; }
    .job p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }

    .splash { position: fixed; inset: 0; z-index: 1000; background: #17223c; color: #fff; display: grid; place-items: center; transition: opacity .28s ease, visibility .28s ease; }
    .splash.done { opacity: 0; visibility: hidden; }
    .splash-inner { text-align: center; max-width: 440px; padding: 20px; }
    .splash-logo { width: 72px; height: 72px; margin: auto; display: grid; place-items: center; background: linear-gradient(145deg, #5879ef, #11b79b); border-radius: 20px; font-size: 24px; font-weight: 750; }
    .splash h1 { font-size: 21px; margin: 17px 0 5px; }
    .splash p { margin: 0; color: #c6d1e8; }
    .splash .button { margin-top: 16px; color: #172033; background: #fff; }
    .splash-line { margin: 22px auto 0; width: 210px; height: 3px; background: #2d3b5e; overflow: hidden; border-radius: 3px; }
    .splash-line::after { content: ""; display: block; height: 100%; width: 45%; background: #68dbc3; animation: loading 1s ease infinite; }
    @keyframes loading { from { transform: translateX(-100%); } to { transform: translateX(320%); } }
    .signed-out { padding: 48px; max-width: 640px; }
    .signed-out h1 { font-size: 24px; margin-bottom: 10px; }

    /* Standalone (detached) route: one screen, no navigation, no tab strip. */
    body.view-detached .sidebar, body.view-detached .splitter, body.view-detached .tabs, body.view-detached .app-picker,
    body.view-detached #navToggle, body.view-detached [data-command="XLExportAll"] { display: none !important; }
    body.view-detached .body-grid { grid-template-columns: minmax(0, 1fr); }
    body.view-detached .workspace { grid-template-rows: minmax(0, 1fr); }
    body.view-detached .unreachable { inset: 0; }
    .detached-tag { font-size: 12px; border: 1px solid var(--line-strong); border-radius: 20px; padding: 3px 10px; color: var(--muted); }

    /* Print document: generated separately from the interactive layout. */
    .print-view { position: fixed; inset: 0; z-index: 400; background: var(--bg); overflow: auto; }
    .print-bar { position: sticky; top: 0; display: flex; gap: 8px; align-items: center; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line-strong); z-index: 3; }
    .print-bar h2 { font-size: 15px; margin-right: auto; }
    .print-page { background: #fff; color: #111; width: min(1120px, calc(100% - 32px)); margin: 18px auto; padding: 28px 32px; box-shadow: var(--shadow); border: 1px solid #c9c9c9; }
    .print-page.portrait { width: min(800px, calc(100% - 32px)); }
    .print-page header { display: flex; justify-content: space-between; gap: 16px; border-bottom: 2px solid #111; padding-bottom: 8px; margin-bottom: 12px; }
    .print-page h1 { font-size: 20px; }
    .print-page .print-meta { font-size: 11px; color: #444; text-align: right; }
    .print-page table { min-width: 0; font-size: 11.5px; }
    .print-page th, .print-page td { border-bottom: 1px solid #bbb; padding: 5px 7px; color: #111; background: #fff; position: static; }
    .print-page thead th { text-transform: none; letter-spacing: 0; font-size: 11.5px; border-bottom: 2px solid #111; }
    .print-page .group-row th { background: #eee; }
    .print-page footer { margin-top: 12px; font-size: 10.5px; color: #444; display: flex; justify-content: space-between; }

    /* Prototype tools: deliberately not product chrome. */
    .proto { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12.5px; }
    .modal.proto { border: 3px dashed #b45309; border-radius: 4px; background: #fffbea; color: #1c1917; width: min(900px, 100%); }
    .modal.proto .modal-head { background: repeating-linear-gradient(135deg, #facc15 0 14px, #1c1917 14px 28px); border-bottom: 3px solid #1c1917; }
    .modal.proto .modal-head h2 { background: #fffbea; color: #1c1917; padding: 3px 10px; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; }
    .modal.proto .modal-head .icon-button { background: #fffbea; color: #1c1917; border: 2px solid #1c1917; border-radius: 2px; }
    .modal.proto fieldset { border: 1px dashed #78716c; margin: 0 0 14px; padding: 10px 12px; }
    .modal.proto legend { font-weight: 700; padding: 0 6px; text-transform: uppercase; letter-spacing: .05em; }
    .modal.proto label { display: block; padding: 2px 0; }
    .modal.proto select, .modal.proto input[type="text"] { border: 1px solid #1c1917; background: #fff; color: #1c1917; padding: 4px 6px; border-radius: 2px; }
    .modal.proto .button { border-radius: 2px; border: 2px solid #1c1917; background: #fff; color: #1c1917; font-weight: 700; }
    .modal.proto .modal-foot { border-top: 3px solid #1c1917; }
    .modal.proto pre { margin: 8px 0 0; padding: 10px; background: #1c1917; color: #fde68a; max-height: 300px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
    .modal.proto ul { margin: 6px 0; padding-left: 18px; }
    .proto-flag { position: fixed; z-index: 500; left: 10px; bottom: 34px; background: #facc15; color: #1c1917; border: 2px dashed #1c1917; padding: 3px 8px; font: 700 11px ui-monospace, Consolas, monospace; border-radius: 2px; }
    .about-proto { margin-top: 18px; border: 2px dashed #b45309; background: #fffbea; color: #1c1917; padding: 10px 12px; font: 12.5px ui-monospace, Consolas, monospace; }
    .about-proto .button { border-radius: 2px; border: 2px solid #1c1917; background: #fff; color: #1c1917; font-weight: 700; margin-top: 8px; }

    @media (max-width: 1180px) {
      .shell-button .cmd-label { display: none; }
    }
    @media (max-width: 980px) {
      :root { --nav-width: 230px; }
      .brand-copy span { display: none; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .action-layout { grid-template-columns: 1fr; }
      .launch-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 760px) {
      body { overflow: auto; }
      #app { min-height: 100%; height: auto; }
      .brand-copy, .user-copy, .conn .conn-text, .global-commands .overflowable { display: none; }
      .topbar { gap: 8px; padding: 8px 10px; }
      .topbar-spacer, .user-button > span:last-child { display: none; }
      .app-picker { flex: 1; min-width: 96px; }
      .body-grid { display: block; }
      .sidebar { position: fixed; z-index: 80; top: 0; bottom: 0; left: 0; width: min(310px, 88vw); transform: translateX(-102%); transition: transform .2s ease; box-shadow: var(--shadow); }
      .sidebar.mobile-open { transform: translateX(0); }
      .sidebar.collapsed .nav-label, .sidebar.collapsed .nav-tool, .sidebar.collapsed .nav-group-title .group-text, .sidebar.collapsed .sidebar-head h2 { display: revert; }
      .nav-backdrop.open { display: block; position: fixed; inset: 0; z-index: 79; background: rgba(15, 20, 31, .5); }
      .splitter { display: none; }
      .workspace { min-height: calc(100vh - 110px); }
      .screen-host { padding: 12px; overflow: visible; }
      .form-grid { grid-template-columns: 1fr; }
      .form-grid .wide { grid-column: auto; }
      .master-detail, .tree-detail, .junction { grid-template-columns: 1fr; }
      .pick-actions { flex-direction: row; justify-content: center; flex-wrap: wrap; }
      .pick-actions .wide-glyph { display: none; }
      .pick-actions .narrow-glyph { display: inline; }
      .launch-grid { grid-template-columns: 1fr; }
      .tool-button .label-text { display: none; }
      .screen-heading h1 { font-size: 19px; }
      .detail-kv, .kv { grid-template-columns: 1fr; gap: 2px; }
      .modal-backdrop { padding: 8px; }
      .job-tray { top: auto; bottom: 44px; }
      .table-wrap { max-height: none; }
    }
    @media (max-width: 430px) {
      .stats { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
    }
    @media print {
      body > *:not(.print-view) { display: none !important; }
      html, body { height: auto; overflow: visible; background: #fff; }
      .print-view { position: static; overflow: visible; background: #fff; }
      .print-bar { display: none !important; }
      .print-page { box-shadow: none; border: 0; margin: 0; width: auto; padding: 0; }
      .print-page thead { display: table-header-group; }
      .print-page tr { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#screenHost">Skip to main content</a>
  <div class="splash" id="splash" role="status">
    <div class="splash-inner">
      <div class="splash-logo" aria-hidden="true">a</div>
      <h1>annper Workspace</h1>
      <p id="splashText">Starting your session…</p>
      <div class="splash-line" id="splashLine"></div>
      <div id="splashActions"></div>
    </div>
  </div>

  <div id="app">
    <header class="topbar" id="topbar">
      <button class="icon-button hidden" id="navToggle" type="button" data-command="ToggleNav" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">☰</button>
      <button class="brand" id="homeButton" type="button" data-command="Home" aria-label="annper Workspace home" title="Workspace home">
        <span class="brand-mark" aria-hidden="true">a</span>
        <span class="brand-copy"><strong>annper Workspace</strong><span id="brandSub"></span></span>
      </button>
      <div class="app-picker"><label class="sr-only" for="appSelect">Switch application</label><select id="appSelect" title="Switch application"></select></div>

      <button class="user-button" id="userButton" type="button" data-command="UserMenu" aria-haspopup="menu" aria-expanded="false"></button>
    </header>

        const record = { time: new Date().toISOString(), kind, what, correlationId, version: currentVersion(), policy: 'allowed', outcome: 'ok' };

      async ping() { const ctx = await this.begin('status', 240, 'the connection check'); return { correlationId: ctx.correlationId }; },

      },
      async query(name, options = {}) {
        const ctx = await this.begin(options.refresh ? 'refresh' : 'load', options.ms ?? 260, 'the query');

      async execute(actionId, values, options = {}) {
        const ctx = await this.begin('write', 200, 'the action');
        authorize(ctx, (Object.values(metadata).find(d => d.actionId === actionId) || {}).id, ['execute']);
        const op = { operationId: nextId('act'), idempotencyKey: options.idempotencyKey || nextId('idem'), name: actionId, outcome: 'inProgress', results: [], submitted: new Date().toISOString(), checks: 0, action: { actionId, values: structuredClone(values) } };

      },
      async savePreference() { const ctx = await this.begin('preference', 90, 'the preference update'); return { correlationId: ctx.correlationId }; }
    };

    const sessionTag = Math.random().toString(16).slice(2, 6).padEnd(4, '0');
    const counters = {};
    const operations = new Map();
    const telemetry = [];
    const sim = { next: 'normal', resolveUnknown: 'committed' };
    const simulationKinds = {
      startup: ['connection-lost', 'forbidden'], definition: ['connection-lost', 'forbidden'], load: ['slow', 'connection-lost', 'data-error', 'forbidden'],

    function applicationAccess(application) {

      return { field: field.id, code: 'BUSINESS_RULE', severity: 'error', message: field.label + ' was not accepted by a business rule on the service. Check the value and try again.' };
    }

    function otherUserChange(row, fields, values, stampField) {
      const free = fields.filter(f => f.writable !== false && !f.computed && !f.key);
      const field = free.find(f => ['currency', 'number'].includes(f.type) && Number.isFinite(row[f.id])) || free.find(f => f.type === 'textarea') || free.find(f => f.type === 'text' && !f.format);

    // ---------------------------------------------------------------------------------------------

    // ---------------------------------------------------------------------------------------------
    // Screen type 1: grid

    function viewPrefs(tab, def) {

      let ignored = 0;

      if (!form || !tab) return;
      const def = metadata[tab.screenId], s = screenState(tab.key);
      switch (form.dataset.form) {
        case 'row':

          s.dirty = differs(editableFields(def), s.edit.values, s.edit.base);
          refreshChrome();
          break;
        case 'record': {
          const record = s.isNew ? defaultsFor(def) : s.rows[s.index] || {};
          s.drafts.current = collectForm(form);   // the draft belongs to the record, not to the controls on screen
          s.dirty = differs(editableFields(def), { ...record, ...s.drafts.current }, record);
          refreshChrome();
          break;
        }
        case 'action': s.values = collectForm(form); break;
        case 'criteria': s.criteria = collectForm(form); s.savedFilter = null; s.page = 0; if (def.type === 'grid') pruneSelection(tab, def, s); renderScreen(); break;
        default: break;
      }
    }
    document.addEventListener('submit', e => e.preventDefault());
    document.addEventListener('click', e => {
      if (openMenuState && !e.target.closest('.menu') && !e.target.closest('#userButton')) closeMenu(false);
      if (e.target.closest('.skip-link')) { e.preventDefault(); hostEl.focus(); return; }
      const closer = e.target.closest('[data-dialog-close]');
      if (closer) { requestCloseDialog(closer.closest('.modal-backdrop, .modeless').dialog); return; }
      const dialogButton = e.target.closest('[data-dialog-button]');
      if (dialogButton) { pressDialogButton(dialogButton.closest('.modal-backdrop, .modeless').dialog, dialogButton.dataset.dialogButton); return; }
      const el = e.target.closest('[data-command]');
      if (el) {
        if (el.disabled || (el.matches('input, select') && el.dataset.change)) return;
        if (el.closest('.menu')) closeMenu(true);
        dispatch(el.dataset.command, { arg: el.dataset.arg, scope: el.dataset.scope, el, shift: e.shiftKey });
        return;
      }
      const row = e.target.closest('tr[data-row]');
      if (row && !e.target.closest('input, button, a, label')) dispatch('SelectOnly', { arg: row.dataset.row });
    });
    document.addEventListener('change', e => {
      const t = e.target;
      if (t.id === 'appSelect') { dispatch('SelectGDApplication', { arg: t.value, scope: 'shell' }); return; }
      if (t.dataset && t.dataset.change) { dispatch(t.dataset.change, { arg: t.dataset.arg, el: t }); return; }
      if (t.dataset && !t.dataset.input && t.dataset.stock === undefined) captureFormInput(t);
    });
    document.addEventListener('input', e => {
      const t = e.target;
      if (!t.dataset) return;
      if (t.dataset.input) { dispatch(t.dataset.input, { arg: t.dataset.arg, el: t }); return; }
      if (t.dataset.stock !== undefined) { captureStock(state.activeTab); refreshChrome(); return; }
      if (t.type !== 'checkbox' && t.tagName !== 'SELECT') captureFormInput(t);
    });
    document.addEventListener('focusin', e => {   // roving tab stop inside command bars
      const bar = e.target.closest ? e.target.closest('[role="toolbar"]') : null;
      if (!bar || !e.target.matches('button')) return;
      bar.querySelectorAll('button').forEach(b => { b.tabIndex = b === e.target ? 0 : -1; });
    });
    const shortcuts = { 'Control+s': 'Save', 'Alt+n': 'New', 'Alt+r': 'Refresh' };
    let typeAhead = { text: '', at: 0 };
    function typeAheadTarget(e, items, textOf) {
      if (e.key.length !== 1 || e.ctrlKey || e.altKey || e.metaKey || e.key === ' ') return null;
      const now = Date.now();
      typeAhead = { text: (now - typeAhead.at < 700 ? typeAhead.text : '') + e.key.toLowerCase(), at: now };
      const from = items.indexOf(document.activeElement), order = items.slice(from + (typeAhead.text.length > 1 ? 0 : 1)).concat(items.slice(0, from + 1));
      return order.find(el => textOf(el).trim().toLowerCase().startsWith(typeAhead.text)) || null;
    }
    document.addEventListener('keydown', e => {
      if (state.signedOut) return;
      const target = e.target, top = topDialog(), printView = document.querySelector('.print-view');
      if (openMenuState) {
        const items = [...openMenuState.el.querySelectorAll('[role="menuitem"]')], at = items.indexOf(document.activeElement);
        if (e.key === 'Escape') { e.preventDefault(); closeMenu(true); return; }
        if (e.key === 'Tab') { closeMenu(true); return; }
        if (['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(e.key)) { e.preventDefault(); items[e.key === 'Home' ? 0 : e.key === 'End' ? items.length - 1 : (at + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus(); return; }
      }
      if (e.key === 'Escape') {
        if (printView) { e.preventDefault(); closePrintDocument(); }
        else if (top) { e.preventDefault(); requestCloseDialog(top); }
        else if (sidebar.classList.contains('mobile-open')) { sidebar.classList.remove('mobile-open'); mobileState(); document.getElementById('navToggle').focus(); }
        return;
      }
      if (e.key === 'Tab') {
        if (printView) trapTab(e, printView);
        else if (top) trapTab(e, top.section);
        else if (sidebar.classList.contains('mobile-open') && narrow.matches) trapTab(e, sidebar);
        return;
      }
      if (target.dataset && target.dataset.lookupDisplay && (e.key === 'Enter' || e.key === 'F4' || (e.key === 'ArrowDown' && e.altKey))) { e.preventDefault(); target.parentElement.querySelector('[data-command="Lookup"]').click(); return; }
      if (top) {
        if (e.key === 'Enter' && target.tagName === 'INPUT' && !['checkbox', 'radio', 'search'].includes(target.type) && top.options.defaultButton) { e.preventDefault(); pressDialogButton(top, top.options.defaultButton); return; }
        if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !isTyping(target) && top.foot.isConnected) {   // message-box accelerators
          const hit = top.foot.querySelector(`[data-key="${CSS.escape(e.key.toLowerCase())}"]:not(:disabled)`);
          if (hit && top.options.role === 'alertdialog') { e.preventDefault(); hit.click(); }
        }
        return;
      }
      if (printView) return;
      const tabButton = target.closest ? target.closest('[role="tab"]') : null;
      if (tabButton) {
        const tabs = [...tabsEl.querySelectorAll('[role="tab"]')], at = tabs.indexOf(tabButton);
        if (['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) {
          e.preventDefault();
          const next = tabs[e.key === 'Home' ? 0 : e.key === 'End' ? tabs.length - 1 : (at + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length];

        }

      const bar = target.closest ? target.closest('[role="toolbar"]') : null;
      if (bar && target.matches('button') && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) {
        const buttons = [...bar.querySelectorAll('button:not(:disabled)')], at = buttons.indexOf(target);
        e.preventDefault();
        buttons[e.key === 'Home' ? 0 : e.key === 'End' ? buttons.length - 1 : (at + (e.key === 'ArrowRight' ? 1 : -1) + buttons.length) % buttons.length].focus();
        return;
      }
      const treeItem = target.closest ? target.closest('[role="treeitem"]') : null;
      if (treeItem) {
        const tab = activeTabObj(), s = screenState(tab.key), items = visibleTreeItems(), at = items.indexOf(treeItem), id = treeItem.dataset.tree, expanded = treeItem.getAttribute('aria-expanded');
        const go = el => { e.preventDefault(); focusTreeItem(el, s); };
        if (e.key === 'ArrowDown') go(items[Math.min(items.length - 1, at + 1)]);
        else if (e.key === 'ArrowUp') go(items[Math.max(0, at - 1)]);
        else if (e.key === 'Home') go(items[0]);
        else if (e.key === 'End') go(items[items.length - 1]);
        else if (e.key === 'ArrowRight') { e.preventDefault(); if (expanded === 'false') dispatch('TreeToggle', { arg: id }); else if (expanded === 'true') focusTreeItem(items[at + 1], s); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); if (expanded === 'true') dispatch('TreeToggle', { arg: id }); else { const hit = findNode(s.rows, id); if (hit && hit.parent) focusTreeItem(items.find(n => n.dataset.tree === String(hit.parent.id)), s); } }
        else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); dispatch('TreeSelect', { arg: id }); }
        else { const hit = typeAheadTarget(e, items, el => el.lastElementChild.textContent); if (hit) go(hit); }
        return;
      }
      if (e.key === 'Enter' && target.tagName === 'INPUT' && !['checkbox', 'radio', 'search'].includes(target.type)) {
        const form = target.closest('form[data-form]');
        if (form && form.dataset.form === 'record') { e.preventDefault(); dispatch('Save'); return; }
        if (form && form.dataset.form === 'action') { e.preventDefault(); dispatch('Run'); return; }
      }
      if (e.key === 'Enter' && target.id === 'gridSearch') { e.preventDefault(); dispatch('SearchStep', { arg: e.shiftKey ? '-1' : '1' }); return; }
      const combo = (e.ctrlKey ? 'Control+' : '') + (e.altKey ? 'Alt+' : '') + e.key.toLowerCase();
      if (shortcuts[combo]) { e.preventDefault(); if (document.activeElement && document.activeElement.blur && isTyping(document.activeElement)) document.activeElement.dispatchEvent(new Event('change', { bubbles: true })); dispatch(shortcuts[combo]); return; }
      if (e.key === 'F1') { e.preventDefault(); dispatch('Help', { scope: 'shell' }); }
    });
    navEl.addEventListener('keydown', e => {
      const current = e.target.closest('[data-nav], [data-nav-tool]');
      if (!current) return;
      const mains = [...navEl.querySelectorAll('[data-nav]')].filter(n => n.getClientRects().length), row = current.closest('.nav-row');
      const focusNav = el => { if (!el) return; navEl.querySelectorAll('[tabindex="0"]').forEach(n => { n.tabIndex = -1; }); if (el.matches('[data-nav]')) { el.tabIndex = 0; state.navFocus = el.dataset.fk; } el.focus(); };
      if (current.matches('[data-nav-tool]')) {
        const tools = [...row.querySelectorAll('[data-nav-tool]:not(:disabled)')], at = tools.indexOf(current), item = row.querySelector('[data-nav]');
        if (e.key === 'ArrowLeft') { e.preventDefault(); focusNav(at > 0 ? tools[at - 1] : item); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); if (tools[at + 1]) tools[at + 1].focus(); }
        else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); focusNav(mains[Math.max(0, Math.min(mains.length - 1, mains.indexOf(item) + (e.key === 'ArrowDown' ? 1 : -1)))]); }
        return;
      }
      const at = mains.indexOf(current), isGroup = current.matches('.nav-group-title');
      if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown') && current.dataset.fk && current.dataset.fk.startsWith('nav:my:')) { e.preventDefault(); dispatch('MoveShortcut', { arg: current.dataset.arg + ':' + (e.key === 'ArrowUp' ? 'up' : 'down') }); return; }
      if (e.key === 'ArrowDown') { e.preventDefault(); focusNav(mains[Math.min(mains.length - 1, at + 1)]); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); focusNav(mains[Math.max(0, at - 1)]); }
      else if (e.key === 'Home') { e.preventDefault(); focusNav(mains[0]); }
      else if (e.key === 'End') { e.preventDefault(); focusNav(mains[mains.length - 1]); }
      else if (e.key === 'ArrowRight') {
        e.preventDefault();

        else { const tool = row && row.querySelector('[data-nav-tool]:not(:disabled)'); if (tool && tool.getClientRects().length) tool.focus(); }
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        if (isGroup) { if (current.getAttribute('aria-expanded') === 'true') dispatch('ToggleGroup', { arg: current.dataset.arg }); }
        else focusNav(current.closest('.nav-group').querySelector('.nav-group-title'));
      } else { const hit = typeAheadTarget(e, mains, el => (el.querySelector('.nav-label, .group-text') || el).textContent); if (hit) { e.preventDefault(); focusNav(hit); } }
    });
    navEl.addEventListener('focusin', e => { const main = e.target.closest('[data-nav]'); if (main) { navEl.querySelectorAll('[data-nav][tabindex="0"]').forEach(n => { n.tabIndex = -1; }); main.tabIndex = 0; state.navFocus = main.dataset.fk; } });
    let dragging = false;
    splitter.addEventListener('pointerdown', e => { dragging = true; splitter.classList.add('dragging'); splitter.setPointerCapture(e.pointerId); });
    splitter.addEventListener('pointermove', e => { if (dragging) setNavWidth(e.clientX, false); });
    const endDrag = () => { if (!dragging) return; dragging = false; splitter.classList.remove('dragging'); setNavWidth(Number(splitter.getAttribute('aria-valuenow')), true); };
    splitter.addEventListener('pointerup', endDrag);
    splitter.addEventListener('pointercancel', endDrag);
    splitter.addEventListener('keydown', e => {
      const now = Number(splitter.getAttribute('aria-valuenow'));
      const next = { ArrowLeft: now - 16, ArrowRight: now + 16, Home: 210, End: navWidthLimit() }[e.key];
      if (next === undefined) return;
      e.preventDefault(); setNavWidth(next, true);   // keyboard resizing is saved too
    });
    narrow.addEventListener('change', () => { sidebar.classList.remove('mobile-open'); applyNavPrefs(); mobileState(); });
    window.addEventListener('resize', () => { if (!narrow.matches && state.started) applyNavPrefs(); });
    window.addEventListener('hashchange', () => { onRouteChange(); });
    window.addEventListener('message', onWindowMessage);
    window.addEventListener('offline', () => { if (state.started && !state.signedOut) connectionLost(null); });
    window.addEventListener('online', () => { if (state.connection === 'lost') dispatch('RetryConnection', { scope: 'shell' }); });
    document.addEventListener('visibilitychange', () => { if (state.started && !state.signedOut) autoRefreshTick(); });
    window.addEventListener('beforeunload', e => {   // a usability aid only; nothing is saved here
      if (Object.values(state.screens).some(s => s.dirty || s.saving || s.unknown || (s.job && s.job.status === 'running'))) { e.preventDefault(); e.returnValue = ''; }
    });
    setInterval(() => { autoRefreshTick(); watchDetached(); }, 1000);

    // ---------------------------------------------------------------------------------------------
    // Start-up: session, application, preferences and route, then the first usable state
    // ---------------------------------------------------------------------------------------------
    function startupFailed(error) {
      const text = document.getElementById('splashText'), actions = document.getElementById('splashActions');
      document.getElementById('splashLine').style.display = 'none';
      actions.innerHTML = '';
      if (error && error.kind === 'forbidden') text.textContent = 'You cannot start annper Workspace because access was refused, so nothing has been loaded.' + (error.correlationId ? ' Support reference: ' + error.correlationId + '.' : '');
      else {
        text.textContent = 'annper Workspace could not start because the service could not be reached. Nothing has been loaded.' + (error && error.correlationId ? ' Support reference: ' + error.correlationId + '.' : '');
        const retry = document.createElement('button');
        retry.type = 'button'; retry.className = 'button'; retry.textContent = 'Retry';
        retry.addEventListener('click', () => { actions.innerHTML = ''; document.getElementById('splashLine').style.display = ''; text.textContent = 'Starting your session…'; start(); });
        actions.appendChild(retry); retry.focus();
      }
    }
    // Blocked start-up for one application. The reason comes from that application's own list of users.
    function startupBlocked(application, reason, others, correlationId) {
      const text = document.getElementById('splashText'), actions = document.getElementById('splashActions');
      const detail = { 'Not a user of this application': 'You are not on its list of users.', 'Inactive': 'Your entry on its list of users is inactive.', 'No role': 'Your entry on its list of users holds no active role.' }[reason] || '';
      document.getElementById('splashLine').style.display = 'none';
      text.textContent = `You cannot start ${application.name}: ${reason}. ${detail} Nothing has been loaded for it. Ask the people who manage ${application.name} for access.` + (correlationId ? ' Support reference: ' + correlationId + '.' : '');
      actions.innerHTML = '';
      others.forEach(other => {
        const open = document.createElement('button');
        open.type = 'button'; open.className = 'button'; open.textContent = 'Open ' + other.name;
        open.addEventListener('click', () => { location.hash = '#/' + other.id; location.reload(); });
        actions.appendChild(open);
      });
      document.title = 'Cannot start ' + application.name + ' · annper Workspace';
    }
    // Prototype tools only: changes this window's copy of one application's entry for the signed-in person.
    function simulateAccess(application, how) {
      const entry = (application.users || []).find(u => u.subject === session.subject);
      if (how === 'not-a-user') application.users = (application.users || []).filter(u => u !== entry);
      else if (how === 'inactive' && entry) entry.active = false;
      else if (how === 'no-role' && entry) entry.roles = [];
    }
    async function start() {
      window.annperStarted = true;
      const route = parseRoute(location.hash), p = route.params;
      applyTheme();
      if (p.support === '1') state.support = true;
      if (p.sim && p.at === 'startup' && !state.startAttempted) sim.next = p.sim;
      const entryIn = a => (a.users || []).find(u => u.subject === session.subject);
      const addressed = source.applications.find(a => a.id === route.appId) || null;
      if (p.access && !state.startAttempted) simulateAccess(addressed || source.applications.find(a => (entryIn(a) || {}).default === true) || source.applications[0], p.access);
      state.startAttempted = true;
      appContainer.inert = true;
      let info;
      try { info = await api.session(); }
      catch (error) { startupFailed(error); return; }
      state.sessionCorrelation = info.correlationId;
      const known = id => source.applications.some(a => a.id === id);
      const blockedReason = a => (info.applications.find(x => x.id === a.id) || { blocked: 'Not a user of this application' }).blocked;
      const startable = source.applications.filter(a => !blockedReason(a));
      // With no address, the first application whose entry for this person is marked default opens; failing that, the first they can start.
      const chosen = addressed || startable.find(a => entryIn(a).default === true) || startable[0] || source.applications[0];
      if (blockedReason(chosen)) { startupBlocked(chosen, blockedReason(chosen), startable.filter(a => a !== chosen), info.correlationId); return; }
      state.appId = chosen.id;
      state.view = p.view === 'detached' && route.screenId ? 'detached' : 'workspace';
      state.started = true;
      appContainer.inert = false;
      applyNavPrefs(); mobileState(); renderAll(); renderJobs(); renderProtoFlag();
      document.getElementById('splash').classList.add('done');
      const late = p.when === 'after-load';
      if (p.sim && p.at !== 'startup' && !late) { sim.next = p.sim; renderProtoFlag(); }
      if (route.appId && !known(route.appId)) toast('The address did not match an application you can use, so your default application was opened.', 'info');
      if (route.screenId && known(route.appId)) await openScreen(route.screenId, { subkey: route.subkey, focus: false });
      else if (!known(route.appId) && app().defaultScreen) await openScreen(app().defaultScreen, { focus: false });   // no address: the application's default screen
      else syncRoute(true);
      if (state.view === 'detached' && window.opener) { try { window.opener.postMessage({ annper: 'state', dirty: false }, '*'); } catch (error) { /* no workspace window */ } }
      if (p.sim && late) { sim.next = p.sim; renderProtoFlag(); }
      if (p.view === 'print' && state.activeTab) await openPrintDocument(state.activeTab);
      if (p.do) await protoAutoplay(p.do);
    }
    start().catch(error => { if (window.console) console.error(error); startupFailed(error); });
  })();
  </script>
