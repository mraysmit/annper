    function renderNavigation(){const groups=model.navigation[state.appId]||[];host.innerHTML=`<div class="toolbar"><button class="button" data-add-nav-group>＋ Add group</button><button class="button" data-add-nav-item>＋ Add item</button><span class="divider"></span><button class="button" data-preview-nav>▷ Preview navigation</button><span class="right muted">Use Move controls for accessible deterministic ordering</span></div><div class="nav-builder"><section class="panel"><div class="panel-head"><h2>Navigation structure</h2><p class="right">${groups.reduce((n,g)=>n+g.items.length,0)} items</p></div><div class="panel-body">${groups.map((g,gi)=>`<div><div class="nav-tree-row ${state.navSelection===`group:${g.id}`?'active':''}" data-nav-selection="group:${g.id}"><span>⌄</span><strong class="label">${esc(g.label)}</strong><div class="move-buttons"><button data-move-group="${gi}:-1" aria-label="Move group up">↑</button><button data-move-group="${gi}:1" aria-label="Move group down">↓</button></div></div><div class="nav-children">${g.items.map((it,ii)=>`<div class="nav-tree-row ${state.navSelection===`item:${g.id}:${it.id}`?'active':''}" data-nav-selection="item:${g.id}:${it.id}"><span>${icon(it.icon)}</span><span class="label">${esc(it.label)}</span><div class="move-buttons"><button data-move-item="${g.id}:${ii}:-1" aria-label="Move item up">↑</button><button data-move-item="${g.id}:${ii}:1" aria-label="Move item down">↓</button></div></div>`).join('')}</div></div>`).join('')}</div></section><section class="panel"><div class="panel-head"><h2>Selection properties</h2><button class="button small danger right" data-delete-nav ${state.navSelection?'':'disabled'}>Delete</button></div><div class="panel-body">${navInspector(groups)}</div></section></div>`}
    function navInspector(groups){if(!state.navSelection)return '<div class="muted" style="padding:50px;text-align:center">Select a group or navigation item to edit its properties.</div>';const parts=state.navSelection.split(':');if(parts[0]==='group'){const g=groups.find(x=>x.id===parts[1]);return `<div class="field"><label>Group ID</label><input value="${esc(g.id)}" disabled></div><div class="field"><label>Caption</label><input data-nav-prop="label" data-nav-target="group:${g.id}" value="${esc(g.label)}"></div><div class="field"><label>Sequence</label><input type="number" value="${g.sequence}" disabled><div class="property-help">Sequence is maintained by the move commands.</div></div>`}const g=groups.find(x=>x.id===parts[1]),it=g.items.find(x=>x.id===parts[2]);return `<div class="field"><label>Item ID</label><input value="${esc(it.id)}" disabled></div><div class="field"><label>Caption</label><input data-nav-prop="label" data-nav-target="item:${g.id}:${it.id}" value="${esc(it.label)}"></div><div class="field"><label>Target screen</label><select data-nav-prop="screenId" data-nav-target="item:${g.id}:${it.id}">${model.screens.filter(s=>s.appId===state.appId).map(s=>`<option value="${s.id}" ${it.screenId===s.id?'selected':''}>${esc(s.caption)}</option>`).join('')}</select></div><div class="field"><label>Icon token</label><select data-nav-prop="icon" data-nav-target="item:${g.id}:${it.id}">${['grid','user','table','action','tree','junction','chart','risk'].map(x=>`<option ${it.icon===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="section-title">Resolved target</div><div class="relation-box">${esc(model.screens.find(s=>s.id===it.screenId)?.caption||'Missing screen')}<br><span class="muted">${esc(it.screenId)}</span></div>`}
    function icon(name){return ({grid:'▦',user:'◉',table:'▤',action:'⚙',tree:'⌘',junction:'⇄',chart:'▥',risk:'◇'}[name]||'•')}
    function renderScreens(){const screens=model.screens.filter(s=>s.appId===state.appId);if(!screens.some(s=>s.id===state.selectedScreen)){state.selectedScreen=screens[0]?.id;state.selectedField=screens[0]?.fields[0]?.id}const s=screen();host.innerHTML=`<div class="toolbar"><button class="button" data-add-field>＋ Add field</button><button class="button" data-duplicate-screen>⧉ Duplicate screen</button><span class="divider"></span><button class="button" data-move-field="-1">↑ Move field</button><button class="button" data-move-field="1">↓ Move field</button><button class="button danger" data-delete-field>Delete field</button><button class="button" data-toggle-inspector>${state.inspectorVisible?'Hide inspector':'Show inspector'}</button><span class="right"><span class="status draft">${readOnly()?'Immutable preview':'Draft preview'}</span></span></div><div class="workbench ${state.inspectorVisible?'':'inspector-hidden'}"><section class="wb-pane"><div class="wb-head"><strong>Screens</strong><span class="right status info">${screens.length}</span></div><div class="wb-scroll"><input class="entity-search" data-screen-search placeholder="Filter screens">${screens.map(x=>`<button class="entity ${x.id===state.selectedScreen?'active':''}" data-select-screen="${x.id}"><span class="entity-icon">${icon(x.icon)}</span><span><strong>${esc(x.caption)}</strong><small>${typeLabel(x.type)} · ${esc(x.id)}</small></span><em>›</em></button>`).join('')}<div class="section-title">Fields</div><div class="tree-indent">${s.fields.map((f,i)=>`<button class="entity ${f.id===state.selectedField?'active':''}" data-select-field="${f.id}"><span class="entity-icon">${i+1}</span><span><strong>${esc(f.caption)}</strong><small>${esc(f.type)} · ${esc(f.binding)}</small></span>${f.required?'<em>*</em>':''}</button>`).join('')}</div><div class="section-title">Commands</div><div class="tree-indent">${s.commands.map(c=>`<button class="entity"><span class="entity-icon">↯</span><span><strong>${esc(c.label)}</     function typeLabel(t){return ({grid:'Grid',field:'Field form',masterDetail:'Master-detail',action:'Command / action',treeDetail:'Tree-detail',junction:'Junction editor',chart:'Chart'}[t]||t)}
    function screenCanvas(s){
      const d=model.dataClasses.find(d=>d.id===(s.type==='masterDetail'?s.detailDataClassId:s.dataClassId));

          ${samples.map(row=>`<tr>${fields.map(f=>`<td class="preview-field ${f.id===state.selectedField?'active':''}" data-canvas-field="${esc(f.id)}">${esc(previewValue(f,row))}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${Math.max(1,fields.length)}">No registered fixture rows</td></tr>`}
        </tbody></table>`;

      }else if(s.type==='junction'){

    }

ata-command-policy="${c.key}" value="${esc(c.policy)}"></div>`).join('')}<div class="section-title">Field access</div><p class="property-help">Field-level policies are inherited from the DataClass unless overridden.</p><div class="relation-box">Read policy<br><strong>${esc(dcFor(s)?.policy||'Not resolved')}</strong></div>`;return `<div class="section-title">Screen</div><div class="field"><label>Stable ID</label><input value="${esc(s.id)}" disabled></div><div class="field"><label>Caption</label><input data-screen-prop="caption" value="${esc(s.caption)}"></div><div class="field"><label>Description</label><textarea data-screen-prop="description">${esc(s.description)}</textarea></div><div class="field"><label>Icon token</label><select data-screen-prop="icon">${['grid','user','table','action','tree','junction','chart','risk'].map(i=>`<option ${s.icon===i?'selected':''}>${i}</option>`).join('')}</select></div><div class="section-title">Selected field</div>${f?`<div class="field-row"><div class="field"><label>Field ID</label><input value="${esc(f.id)}" disabled></div><div class="field"><label>Sequence</label><input value="${f.sequence}" disabled></div></div><div class="field"><label>Caption</label><input data-field-prop="caption" value="${esc(f.caption)}"></div><div class="field"><label>Data binding</label><input data-field-prop="binding" value="${esc(f.binding)}"></div><div class="field-row"><div class="field"><label>Control type</label><select data-field-prop="type">${['text','email','number','currency','date','datetime','boolean','select','lookup','textarea'].map(t=>`<option ${f.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>Width</label><input data-field-prop="width" type="number" value="${f.width}"></div></div><div class="field"><label>Value list</label><select data-field-prop="valueList"><option value="">None</option>${model.valueLists.map(v=>`<option value="${v.id}" ${f.valueList===v.id?'selected':''}>${esc(v.name)}</option>`).join('')}</select></div><div class="field"><label>Format</label><input data-field-prop="format" value="${esc(f.format||'')}"></div><div class="field"><label>Validation expression</label><input data-field-prop="validation" value="${esc(f.validation||'')}"></div><label class="check"><input type="checkbox" data-field-prop="required" ${f.required?'checked':''}> Required</label><label class="check"><input type="checkbox" data-field-prop="visible" ${f.visible?'checked':''}> Visible</label><label class="check"><input type="checkbox" data-field-prop="editable" ${f.editable?'checked':''}> Editable</label>`:'No field selected.'}`}
    const dcFor=s=>model.dataClasses.find(d=>d.id===s.dataClassId);

    function renderSecurity(){const screens=model.screens.filter(s=>s.appId===state.appId),roles=model.roles.filter(r=>Object.keys(r.permissions).some(id=>screens.some(s=>s.id===id)));if(!roles.some(r=>r.id===state.selectedRole))state.selectedRole=roles[0]?.id;const role=model.roles.find(r=>r.id===state.selectedRole),letters=['R','W','I','D','E','P'],labels=['Read','Write','Insert','Delete','Export','Print'];host.innerHTML=`<div class="toolbar"><div class="role-tabs">${roles.map(r=>`<button class="role-pill ${r.id===state.selectedRole?'active':''}" data-role="${r.id}">${esc(r.name)} · ${r.members}</button>`).join('')}</div><span class="right"><button class="button" data-effective-access>◉ Preview effective access</button></span></div><section class="panel"><div class="panel-head"><h2>${esc(role.name)} permissions</h2><p class="right">${role.members} assigned users · Server-enforced policies</p></div><div class="permission-wrap"><table class="permission"><thead><tr><th>Screen</th>${labels.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${screens.map(s=>{const p=role.permissions[s.id]||'------';return `<tr><td><strong>${esc(s.caption)}</strong><br><span class="muted">${esc(s.id)}</span></td>${letters.map((l,i)=>`<td><input type="checkbox" data-permission="${s.id}:${i}" aria-label="${labels[i]} ${esc(s.caption)}" ${p[i]===l?'checked':''}></td>`).join('')}</tr>`}).join('')}</tbody></table></div></section><div class="panel" style="margin-top:12px"><div class="panel-head"><h2>Security rules</h2></div><div class="panel-body"><div class="form-grid"><div class="relation-box"><strong>Definition filtering</strong><br><span class="muted">Unauthorized screens, fields and commands are omitted from delivered metadata.</span></div><div class="relation-box"><strong>Execution enforcement</strong><br><span class="muted">Every query, change, action, report and admin operation rechecks policy server-side.</span></div></div></div></div>`}
    function validationIssues(){
      const issues=[],add=(path,text,code='INVALID_REFERENCE',severity='error')=>issues.push({severity,code,path,text});
      const ids=rows=>new Set(rows.map(x=>x.id)),appIds=ids(model.applications),dcIds=ids(model.dataClasses),connectionIds=ids(model.connections),listIds=ids(model.valueLists);
      for(const [name,rows] of [['applications',model.applications],['screens',model.screens],['dataClasses',model.dataClasses],['connections',model.connections],['valueLists',model.valueLists],['reports',model.reports],['roles',model.roles]]){
        if(ids(rows).size!==rows.length)add(name,'Stable IDs must be unique.','DUPLICATE_ID');
      }
      for(const d of model.dataClasses){
        if(!appIds.has(d.appId)||!connectionIds.has(d.connectionId))add(`dataClasses.${d.id}`,'Application or connection does not exist.');
        if(!['query','action'].includes(d.kind)||!['view','procedure','table','adapter'].includes(d.operation))add(`dataClasses.${d.id}`,'Invalid kind or operation.','INVALID_TYPE');
        if(d.kind==='action'&&d.operation!=='procedure')add(`dataClasses.${d.id}`,'Action requires an approved procedure.','INVALID_TYPE');
        if(!fixtures.approvedSources.includes(d.source))add(`dataClasses.${d.id}.source`,'Source is not in the local approved catalogue.','UNAPPROVED_SOURCE');
        if(!Number.isFinite(d.timeoutSeconds)||d.timeoutSeconds<=0||!Number.isFinite(d.cacheSeconds)||d.cacheSeconds<0)add(`dataClasses.${d.id}`,'Timeout/cache values are invalid.','INVALID_NUMBER');
      }
      for(const s of model.screens){
        const d=dcFor(s),detail=model.dataClasses.find(x=>x.id===s.detailDataClassId);
        if(!appIds.has(s.appId)||!dcIds.has(s.dataClassId))add(`screens.${s.id}`,'Application or master DataClass does not exist.');
        if(s.detailDataClassId&&!detail)add(`screens.${s.id}.detailDataClassId`,'Detail DataClass does not exist.');
        if(!['grid','field','masterDetail','action','treeDetail','junction','chart'].includes(s.type))add(`screens.${s.id}.type`,'Unsupported screen type.','INVALID_TYPE');
        if(new Set(s.fields.map(f=>f.id)).size!==s.fields.length)add(`screens.${s.id}.fields`,'Field IDs must be unique.','DUPLICATE_ID');
        const bindings=new Set(d?.kind==='action'?d.parameters.map(p=>p.name.replace(/^@/,'')):[...(d?.resultFields||[]),...(detail?.resultFields||[])]);
        for(const f of s.fields){
          const path=`screens.${s.id}.fields.${f.id}`;
          if(!bindings.has(f.binding))add(path,'Binding is absent from the declared schema/parameters.');
          if(f.valueList&&!listIds.has(f.valueList))add(path,'Value list does not exist.');
          if(f.type==='currency'&&!f.format)add(path,'Currency field requires an explicit format.','FIELD_FORMAT_REQUIRED');
          if(!['text','email','number','currency','date','datetime','boolean','select','lookup','textarea'].includes(f.type))add(path,'Unsupported control type.','INVALID_TYPE');
          if(!f.caption?.trim())add(path,'An accessible caption is required.','CAPTION_REQUIRED');
        }
      }
      for(const a of model.applications){
        if(!model.screens.some(s=>s.id===a.defaultScreen&&s.appId===a.id))add(`applications.${a.id}.defaultScreen`,'Default screen is missing or belongs to another application.');
        for(const g of model.navigation[a.id]||[])for(const it of g.items)if(!model.screens.some(s=>s.id===it.screenId&&s.appId===a.id))add(`navigation.${a.id}.${it.id}`,'Navigation target is invalid.');
      }
      for(const v of model.valueLists)if(v.mode==='dataClass'&&!dcIds.has(v.dataClassId))add(`valueLists.${v.id}`,'Lookup DataClass is missing.');
      for(const r of model.reports){
        const d=model.dataClasses.find(x=>x.id===r.dataClassId);
        if(!d)add(`reports.${r.id}`,'Report DataClass is missing.');
        for(const c of r.columns)if(!d?.resultFields.includes(c.field))add(`reports.${r.id}.${c.field}`,'Output field is absent from result schema.');
      }
      for(const c of model.connections)if(c.health==='Warning')add(`connections.${c.id}`,'Fixture simulates degraded provider health.','PROVIDER_HEALTH_WARNING','warning');
      return issues;
    }
    function renderValidation(){const issues=validationIssues(),errors=issues.filter(x=>x.severity==='error').length,warnings=issues.filter(x=>x.severity==='warning').length;host.innerHTML=`<div class="issue-summary"><div class="issue-stat"><span class="muted">Compiler checks</span><strong>${state.validation?'Completed':'—'}</strong><span class="status ${state.validated?'good':'warn'}">${state.validation?(state.validated?'Passed':'Failed'):'Not run'}</span></div><div class="issue-stat"><span class="muted">Errors</span><strong>${errors}</strong><span class="status ${errors?'bad':'good'}">${errors?'Blocks publish':'Clear'}</span></div><div class="issue-stat"><span class="muted">Warnings</span><strong>${warnings}</strong><span class="status warn">Review required</span></div><div class="issue-stat"><span class="muted">Candidate digest</span><strong style="font-size:13px">${digest()}</strong><span class="status info">Demo fingerprint</span></div></div><section class="panel" style="position:relative"><div class="panel-head"><h2>Validation results</h2><p class="right">References · types · security · provider · accessibility · compatibility</p></div>${issues.map(i=>`<article class="issue"><span class="issue-icon ${i.severity}">${i.severity==='error'?'×':i.severity==='warning'?'!':'i'}</span><span class="status ${i.severity==='error'?'bad':i.severity==='warning'?'warn':'info'}">${i.severity}</span><div><strong>${esc(i.code)}</strong><p>${esc(i.text)}</p><code>${esc(i.path)}</code></div><button class="button small" data-fix-issue="${esc(i.code)}">Open</button></article>`).join('')}${state.compiling?'<div class="compile-overlay"><div><div class="spinner"></div><p>Compiling immutable metadata bundle…</p></div></div>':''}</section>`}

    function runValidation(){
      if(readOnly())return toast('Select the draft to validate.','warn');
      const config=configuration(),serialized=canonical(config),candidate=digest(config);
      state.module='validation';state.compiling=true;state.validated=false;render();status('Validating local metadata…');
      setTimeout(()=>{
        state.compiling=false;
        if(canonical(configuration())!==serialized){invalidate();render();return toast('Candidate changed; rerun validation.','warn');}
        const issues=validationIssues();state.validation={digest:candidate,serialized,issues,time:new Date().toISOString()};
        state.validated=!issues.some(i=>i.severity==='error');
        appendAudit(state.validated?'Validation passed':'Validation failed',model.draft.id,`Digest ${candidate}; ${issues.filter(i=>i.severity==='error').length} errors`);
        render();status('Validation completed');toast(state.validated?'Candidate passed validation':'Blocking errors prevent publication',state.validated?'':'warn');
      },350);
    }
    function publish(){
      if(readOnly())return toast('Select the draft to publish.','warn');
      const serialized=canonical(configuration()),candidate=digest();
      if(!state.validated||state.validation?.serialized!==serialized||validationIssues().some(i=>i.severity==='error')){
        state.module='validation';render();return toast('Publication blocked: validate this exact candidate and resolve errors.','warn');
      }
      if(!['Product','Security','Test'].every(role=>state.approvals[role]?.serialized===serialized))return toast('Publication blocked: all three digest-bound checker approvals are required.','warn');
      if(!state.publicationNote.trim())return toast('Add a publication note including accepted warnings.','warn');
      const config=freeze(configuration()),approvals=freeze(structuredClone(state.approvals)),note=state.publicationNote;
      showModal(`Publish ${model.draft.label}`,`<p>Atomically activate this complete demonstration workspace bundle for ${model.applications.length} applications.</p><p>Demo digest <code>${candidate}</code>. All three approvals match this exact configuration.</p><label class="check"><input id="confirmPublish" type="checkbox"> Confirm activation of the approved candidate</label>`,[
        {label:'Cancel',action:closeModal},{label:'Publish',primary:true,action:()=>{

          if(canonical(configuration())!==serialized||state.validation?.serialized!==serialized)return toast('Candidate changed; revalidate and reapprove.','warn');
          releases.filter(v=>v.status==='Published').forEach(v=>v.status='Superseded');
          const release={id:model.draft.id,label:model.draft.label.replace(/^Draft /,''),status:'Published',author:model.draft.owner,date:new Date().toISOString(),digest:candidate,snapshot:config,approvals,summary:note};
          releases.unshift(release);appendAudit('Published version',release.id,`Activated digest ${candidate}; checker approvals recorded`);
          startNextDraft(config,release.id);state.viewVersion=release.id;restore(release.snapshot);

        }}
      ]);
    }

      const dt=e.target.closest('[data-detail-tab]');if(dt){state.detailTab=dt.dataset.detailTab;render();return}
      const editc=e.target.closest('[data-edit-connection]');if(editc){const c=model.connections.find(x=>x.id===editc.dataset.editConnection);showModal(`Edit ${c.name}`,`<div class="form-grid"><div class="field"><label>Logical ID</label><input value="${esc(c.id)}" disabled></div><div class="field"><label>Provider</label><input value="${esc(c.provider)}" disabled></div><div class="field wide"><label>Safe endpoint</label><input id="editEndpoint" value="${esc(c.endpoint)}"></div><div class="field wide"><label>Secret reference</label><input id="editSecret" value="${esc(c.secretRef)}"></div><div class="field"><label>Pool limit</label><input id="editPool" type="number" value="${c.pool}"></div><div class="field"><label>Timeout</label><input id="editTimeout" type="number" value="${c.timeout}"></div></div>`,[{label:'Cancel',action:closeModal},{label:'Save',primary:true,action:()=>{const values={endpoint:document.getElementById('editEndpoint').value,secretRef:document.getElementById('editSecret').value,pool:Number(document.getElementById('editPool').value),timeout:Number(document.getElementById('editTimeout').value)};closeModal();checkpoint('Updated connection',()=>Object.assign(c,values))}}]);return}
      const co=e.target.closest('[data-select-connection]');if(co){state.selectedConnection=co.dataset.selectConnection;render();return}
      const vl=e.target.closest('[data-select-list]');if(vl){state.selectedList=vl.dataset.selectList;render();return}
      const role=e.target.closest('[data-role]');if(role){state.selectedRole=role.dataset.role;render();return}
      const ns=e.target.closest('[data-nav-selection]');if(ns){state.navSelection=ns.dataset.navSelection;render();return}
      if(e.target.closest('[data-add-field]')){addField();return}if(e.target.closest('[data-open-preview]')){preview();return}if(e.target.closest('[data-test-dc]')){testDataClass();return}if(e.target.closest('[data-run-validation]')){runValidation();return}if(e.target.closest('[data-publish]')){publish();return}
      const mf=e.target.closest('[data-move-field]');if(mf){const fields=screen().fields,i=fields.findIndex(f=>f.id===state.selectedField),j=i+Number(mf.dataset.moveField);if(i>=0&&j>=0&&j<fields.length)checkpoint('Reordered field',()=>{[fields[i],fields[j]]=[fields[j],fields[i]];fields.forEach((f,k)=>f.sequence=(k+1)*10)});return}
      if(e.target.closest('[data-delete-field]')){const s=screen(),f=s.fields.find(x=>x.id===state.selectedField);if(!f)return;if(confirm(`Delete field ${f.caption}?`))checkpoint('Deleted field',()=>{s.fields=s.fields.filter(x=>x.id!==f.id);state.selectedField=s.fields[0]?.id});return}
      if(e.target.closest('[data-duplicate-screen]')){const s=structuredClone(screen()),id=`${s.id}-copy`;checkpoint('Duplicated screen',()=>{s.id=id;s.caption+=' copy';model.screens.push(s);state.selectedScreen=id;state.selectedField=s.fields[0]?.id});return}
      const mg=e.target.closest('[data-move-group]');if(mg){const [i,delta]=mg.dataset.moveGroup.split(':').map(Number),arr=model.navigation[state.appId],j=i+delta;if(j>=0&&j<arr.length)checkpoint('Reordered navigation group',()=>{[arr[i],arr[j]]=[arr[j],arr[i]];arr.forEach((x,k)=>x.sequence=(k+1)*10)});return}
      const mi=e.target.closest('[data-move-item]');if(mi){const [gid,idx,delta]=mi.dataset.moveItem.split(':'),arr=model.navigation[state.appId].find(g=>g.id===gid).items,i=Number(idx),j=i+Number(delta);if(j>=0&&j<arr.length)checkpoint('Reordered navigation item',()=>{[arr[i],arr[j]]=[arr[j],arr[i]];arr.forEach((x,k)=>x.sequence=(k+1)*10)});return}
      if(e.target.closest('[data-preview-nav]')){showModal('Navigation preview',`<div class="preview-nav" style="width:240px;border:1px solid var(--line);border-radius:8px">${model.navigation[state.appId].map(g=>`<strong style="display:block;padding:8px">${esc(g.label)}</strong>${g.items.map(i=>`<div class="preview-link">${icon(i.icon)} ${esc(i.label)}</div>`).join('')}`).join('')}</div>`,[{label:'Close',primary:true,action:closeModal}]);return}
      const rp=e.target.closest('[data-role]');if(rp)return;
      const delp=e.target.closest('[data-delete-param]');if(delp){checkpoint('Deleted parameter',()=>dc().parameters.splice(Number(delp.dataset.deleteParam),1));return}
      if(e.target.closest('[data-add-param]')){checkpoint('Added parameter',()=>dc().parameters.push({name:'@new_parameter',type:'string',source:'request',required:false}));return}
      if(e.target.closest('[data-test-connection]')){testConnection();return;}
      const dv=e.target.closest('[data-delete-value]');if(dv){checkpoint('Deleted value-list item',()=>list().values.splice(Number(dv.dataset.deleteValue),1));return}if(e.target.closest('[data-add-value]')){checkpoint('Added value-list item',()=>list().values.push({value:'New',label:'New value',active:true}));return}
      const issue=e.target.closest('[data-fix-issue]');if(issue){if(issue.dataset.fixIssue==='FIELD_FORMAT_REQUIRED'){state.module='screens';state.appId='ops';state.selectedScreen='orders';state.selectedField='amount';state.inspectorTab='properties';render()}else if(issue.dataset.fixIssue==='PROVIDER_HEALTH_WARNING'){state.module='connections';state.selectedConnection='risk-db';render()}else{state.module='values';state.selectedList='segments';render()}return}
      const rollback=e.target.closest('[data-rollback]');if(rollback){rollbackTo(rollback.dataset.rollback);return;}
      if(e.target.closest('[data-effective-access]')){const role=model.roles.find(r=>r.id===state.selectedRole);showModal('Effective access preview',`<h3>${esc(role.name)}</h3><p>Representative subject: <strong>alex.smith@example.test</strong></p>${model.screens.filter(s=>s.appId===state.appId).map(s=>{const p=role.permissions[s.id]||'------';return `<div class="detail-kv"><strong>${esc(s.caption)}</strong><span>${p==='------'?'Hidden':`Read ${p[0]==='R'?'yes':'no'} · Write ${p[1]==='W'?'yes':'no'} · Export ${p[4]==='E'?'yes':'no'}`}</span></div>`}).join('')}<p class="muted">The runtime API independently rechecks these permissions.</p>`,[{label:'Close',primary:true,action:closeModal}]);return}
      if(e.target.closest('[data-close-modal]')||e.target===modal){closeModal();return}
    });
    document.addEventListener('change',e=>{
      if(e.target.id==='reviewActor'){state.reviewActor=e.target.value;return;}
      if(e.target.id==='applicationSelect'){state.appId=e.target.value;state.selectedScreen=model.screens.find(s=>s.appId===state.appId)?.id;state.selectedDataClass=model.dataClasses.find(d=>d.appId===state.appId)?.id;render();updateChrome();return}
      if(e.target.matches('[data-app-prop]')){const p=e.target.dataset.appProp;checkpoint('Updated application',()=>app()[p]=valueOf(e.target));return}if(e.target.matches('[data-app-option]')){checkpoint('Updated application option',()=>app().options[e.target.dataset.appOption]=e.target.checked);return}
      if(e.target.matches('[data-screen-prop]')){const p=e.target.dataset.screenProp;checkpoint('Updated screen',()=>screen()[p]=valueOf(e.target));return}if(e.target.matches('[data-capability]')){checkpoint('Updated screen capability',()=>screen().capabilities[e.target.dataset.capability]=e.target.checked);return}
      if(e.target.matches('[data-field-prop]')){const f=screen().fields.find(x=>x.id===state.selectedField),p=e.target.dataset.fieldProp;checkpoint('Updated field',()=>f[p]=valueOf(e.target));return}if(e.target.matches('[data-command-policy]')){const c=screen().commands.find(x=>x.key===e.target.dataset.commandPolicy);checkpoint('Updated command policy',()=>c.policy=e.target.value);return}
      if(e.target.matches('[data-dc-prop]')){const p=e.target.dataset.dcProp;checkpoint('Updated DataClass',()=>dc()[p]=valueOf(e.target));return}if(e.target.matches('[data-dc-array]')){checkpoint('Updated DataClass key',()=>dc()[e.target.dataset.dcArray]=e.target.value.split(',').map(x=>x.trim()).filter(Boolean));return}
      if(e.target.matches('[data-list-prop]')){const p=e.target.dataset.listProp;checkpoint('Updated value list',()=>list()[p]=valueOf(e.target));return}if(e.target.matches('[data-value-prop]')){const [i,p]=e.target.dataset.valueProp.split(':');checkpoint('Updated value-list item',()=>list().values[Number(i)][p]=valueOf(e.target));return}
      if(e.target.matches('[data-report-prop]')){const r=model.reports.find(x=>x.id===state.selectedReport),p=e.target.dataset.reportProp;checkpoint('Updated report',()=>r[p]=valueOf(e.target));return}
      if(e.target.matches('[data-report-output]')){const r=model.reports.find(x=>x.id===state.selectedReport),output=e.target.dataset.reportOutput;checkpoint('Updated report output',()=>{r.outputs=e.target.checked?[...new Set([...r.outputs,output])]:r.outputs.filter(x=>x!==output)});return}
      if(e.target.matches('[data-report-column]')){const r=model.reports.find(x=>x.id===state.selectedReport),[i,p]=e.target.dataset.reportColumn.split(':');checkpoint('Updated report column',()=>r.columns[Number(i)][p]=e.target.value);return}
      if(e.target.matches('[data-permission]')){const [sid,i]=e.target.dataset.permission.split(':'),role=model.roles.find(r=>r.id===state.selectedRole),letters=['R','W','I','D','E','P'],chars=(role.permissions[sid]||'------').split('');checkpoint('Updated role permission',()=>{chars[Number(i)]=e.target.checked?letters[Number(i)]:'-';role.permissions[sid]=chars.join('')});return}
      if(e.target.matches('[data-nav-prop]')){const [type,gid,iid]=e.target.dataset.navTarget.split(':'),g=model.navigation[state.appId].find(x=>x.id===gid),target=type==='group'?g:g.items.find(x=>x.id===iid);checkpoint('Updated navigation',()=>target[e.target.dataset.navProp]=e.target.value);return}
    });
    document.addEventListener('input',e=>{if(e.target.id==='publishNote')state.publicationNote=e.target.value;if(e.target.matches('[data-screen-search]')){const q=e.target.value.toLowerCase();document.querySelectorAll('[data-select-screen]').forEach(x=>x.classList.toggle('hidden',!x.textContent.toLowerCase().includes(q)))}if(e.target.matches('[data-dc-search]')){const q=e.target.value.toLowerCase();document.querySelectorAll('[data-select-dc]').forEach(x=>x.classList.toggle('hidden',!x.textContent.toLowerCase().includes(q)))}if(e.target.matches('[data-audit-search]')){const q=e.target.value.toLowerCase();document.querySelectorAll('#auditRows tr').forEach(x=>x.classList.toggle('hidden',!x.textContent.toLowerCase().includes(q)))}});
    document.getElementById('undoButton').onclick=()=>{
      if(readOnly()||!state.history.length)return;
      const entry=state.history.pop();state.future.push(configuration());restore(entry.config);draftConfig=configuration();
      state.dirty=Math.max(0,state.dirty-1);invalidate();
      appendAudit('Undid configuration change',entry.target,`Compensates "${entry.label}"; digest ${digest()}`);
      render();toast('Change undone; audit history preserved');
    };
    document.getElementById('jsonButton').onclick=()=>showModal(readOnly()?'Immutable configuration JSON':'Draft configuration JSON',`<div class="toolbar"><button class="button small" id="downloadJson">⇩ Download JSON</button><label class="button small" for="importJson">⇧ Import JSON</label><input id="importJson" ${readOnly()?'disabled':''} type="file" accept="application/json" class="hidden"></div><pre class="json">${esc(JSON.stringify(model,null,2))}</pre>`,[{label:'Close',action:closeModal}]);
    document.getElementById('modalBody').addEventListener('click',e=>{if(e.target.id==='downloadJson'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(model,null,2)],{type:'application/json'}));a.download='gd-metadata-draft-2026.09.2.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('Draft JSON downloaded')}});
    document.getElementById('modalBody').addEventListener('change',e=>{if(e.target.id==='importJson'){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);if(!configKeys.every(k=>data[k])||!Array.isArray(data.applications)||!Array.isArray(data.screens)||!Array.isArray(data.dataClasses))throw Error('Invalid configuration shape');closeModal();checkpoint('Imported JSON draft',()=>restore(data));toast('JSON imported and marked for validation')}catch{toast('JSON file is not valid','warn')}};r.readAsText(file)}});
    document.getElementById('versionSelect').onchange=e=>selectVersion(e.target.value);
    document.getElementById('validateButton').onclick=runValidation;document.getElementById('previewButton').onclick=preview;document.getElementById('publishButton').onclick=publish;document.getElementById('themeButton').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('gd-admin-theme',t)};
    document.getElementById('mobileMenu').onclick=()=>document.getElementById('sidebar').classList.toggle('open');const media=matchMedia('(max-width:760px)');function mediaState(){document.getElementById('mobileMenu').classList.toggle('hidden',!media.matches)}media.addEventListener('change',mediaState);mediaState();
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modal.classList.contains('open'))closeModal();else document.getElementById('sidebar').classList.remove('open')}});
    document.addEventListener('click',e=>{
      if(e.target.closest('[data-export-audit]')){
        const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(audit,null,2)],{type:'application/json'}));a.download='gd-studio-audit.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);
      }
    });
    document.addEventListener('keydown',e=>{
      if(e.key!=='Tab'||!modal.classList.contains('open'))return;
      const controls=[...modal.querySelectorAll('button,input,select,textarea,[tabindex="0"]')].filter(x=>!x.disabled&&x.getClientRects().length);
      const first=controls[0],last=controls.at(-1);
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}
    });
    document.addEventListener('click',e=>{if(readOnly()&&e.target.closest(mutationSelector)){e.preventDefault();e.stopImmediatePropagation();toast('Immutable snapshot: open a draft to edit.','warn');}},true);
    new ResizeObserver(syncTopbar).observe(document.querySelector('.topbar'));
    document.getElementById('pageTitle').tabIndex=-1;
    document.getElementById('applicationSelect').innerHTML=model.applications.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('');const savedTheme=localStorage.getItem('gd-admin-theme');if(savedTheme)document.documentElement.dataset.theme=savedTheme;render();updateChrome();
  })();
  </script>
</body>
