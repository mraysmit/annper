      admin.grants.push({id:`grant-${String(next).padStart(2,'0')}`,role,state:'pending',proposedBy:signedIn().subject,proposedAt:new Date().toISOString(),reason:text});
      return recordAdministration('Proposed Studio role',target,`${role}: pending; it grants nothing until a different platform administrator approves it`,text);
    }
    function decideGrant(id,grantId,approve,reason){
      const admin=findAdministrator(id),grant=admin?.grants.find(g=>g.id===grantId),me=signedIn(),target=`administrators.${id}`,text=String(reason||'').trim();
      const why=administrationBar(admin)||(!grant||grant.state!=='pending'?'That grant is not pending.':grant.proposedBy===me.subject?'The person who proposed a grant cannot decide it. A different platform administrator must approve or reject it.':!text?`A reason is required to ${approve?'approve':'reject'} a grant.`:'');
      if(why)return refuseAdministration(`${approve?'Approve':'Reject'} ${grant?.role||'grant'}`,target,why);

    }
    function withdrawGrant(id,grantId){
      const admin=findAdministrator(id),grant=admin?.grants.find(g=>g.id===grantId),me=signedIn(),target=`administrators.${id}`;

      if(why)return refuseAdministration('Withdraw proposed role',target,why);
      Object.assign(grant,{state:'withdrawn',closedBy:me.subject,closedAt:new Date().toISOString(),closedReason:'Withdrawn by the proposer'});

    }
    function revokeGrant(id,role,reason){

      const why=administrationBar(admin)||(isBootstrap(admin,role)?`${admin.name} holds ${role} from deployment configuration. It is read-only here and can only be changed in the deployment configuration.`:!grant?`${admin?.name||'That person'} does not hold ${role}.`:role==='platform-administrator'&&platformAdministrators().length<=2?'At least two platform administrators are required, because every grant needs a second one to approve it.':!text?'A reason is required to revoke a Studio role.':'');
      if(why)return refuseAdministration(`Revoke ${role}`,target,why);

    }
    function removeAdministrator(id,reason){

      const why=administrationBar(admin)||(!admin?'That Studio user does not exist.':adminRoles(admin).length?`${admin.name} still holds a Studio role. Revoke every Studio role first.`:admin.grants.some(g=>g.state==='pending')?'A grant is still pending for this person. Reject or withdraw it first.':!text?'A reason is required to remove a Studio user.':'');

      return recordAdministration('Removed Studio user',target,`${admin.name} (${admin.subject}); the audit keeps the history`,text);
    }

    // ---- applications as a whole: created and deleted at platform level, each with its own version line ----
    function createApplication(id,name,shortName){
      const key=String(id||'').trim(),title=String(name||'').trim(),short=String(shortName||'').trim();
      if(!can('applications'))return refuseCapability('applications','Creating an application',`applications.${key}`);
      const problem=idProblem(key,Object.keys(lines).map(x=>({id:x})),'application')||(!title||!short?'A display name and a short name are required.':'');
      if(problem){toast(problem,'warn');return false;}
      const now=new Date(),stamp=`${now.getUTCFullYear()}-${String(now.getUTCMonth()+1).padStart(2,'0')}`,label=`Draft ${stamp.replace('-','.')}.1`;
      lines[key]=seedLine({draft:{id:`ver-${stamp}-1`,label,basedOn:'',owner:state.actor,created:now.toISOString(),contributors:[]},publicationRevision:0,
        applications:[{id:key,name:title,shortName:short,group:'',description:'',active:true,defaultScreen:'',navigationStyle:'Grouped',theme:'Indigo',owner:'',options:{showApplicationCaption:true,rememberLastScreen:false,allowPersonalMenus:true}}],
        navigation:{[key]:[]},screens:[],dataClasses:[],connections:[],valueLists:[],reports:[],roles:[],users:[],releases:[]});
      appendAudit('Created application',`applications.${key}`,`${title}: an empty configuration with its own version line, starting at ${label}`,{application:'',version:`ver-${stamp}-1`});return true;
    }
    // An application can go only when nobody can be using it: no Published version and no scheduled publication.
    function deleteApplication(id,reason){
      const line=lineOf(id),name=line?applicationName(id):String(id),text=String(reason||'').trim(),target=`applications.${id}`;
      if(!can('applications'))return refuseCapability('applications','Deleting an application',target);
      const why=!line?'That application does not exist.':Object.keys(lines).length<=1?'The last application cannot be deleted.':line.releases.some(v=>v.status==='Published')?`${name} has a Published version, so its application users can start it. Retire that version first.`:line.schedule?`${name} has a scheduled publication. Cancel it first.`:!text?'A reason is required to delete an application.':'';
      if(why){appendAudit('Refused application deletion',target,why,{outcome:'Denied',application:'',version:line?.draft.id||''});toast(why,'warn');return false;}
      const detail=`${name}: its draft, ${line.releases.length} version record${line.releases.length===1?'':'s'}, ${line.draftConfig.roles.length} application roles and ${line.draftConfig.users.length} application users are removed; no other application is touched`,version=line.draft.id;
      delete lines[id];
      if(id===state.appId){openLine(Object.keys(lines)[0]);state.navSelection=null;state.previewRole='';reconcileSelection();}
      appendAudit('Deleted application',target,detail,{reason:text,application:'',version});return true;
    }

    // ---- application users: entries in one application's configuration, edited in its draft like everything else in it ----
    function liveConfig(){return activeRelease()?.snapshot||null;}
    function findUser(subject,config=model){return (config?.users||[]).find(u=>u.subject===subject);}
    // The application roles an entry names that exist in the same configuration version of the same application.
    function userRoles(user,config=model){return (user?.roles||[]).map(id=>(config?.roles||[]).find(r=>r.id===id)).filter(Boolean);}
    // Start-up admission in one configuration version: an entry, active, holding at least one active role of this application.
    function userStart(user,config=model){
      if(!user)return {ok:false,reason:'Not a user of this application'};

      return {ok:true,reason:''};
    }
    // What GD Workspace applies today: only the Published version of that application decides, never a draft.
    function canStart(subject,appId=state.appId){
      const published=lines[appId]?.releases.find(v=>v.status==='Published')?.snapshot;
      return published?userStart(findUser(subject,published),published):userStart(undefined);
    }
    function userAccess(user,s,config=model){
      const start=userStart(user,config);

    function refuseUserChange(text){toast(text,'warn');return false;}
    function addUser(subject,displayName,email,region,roleId=''){

      if(!can('access'))return refuseCapability('access',CHANGE_TEXT.access,'users');
      if(!isSubject(s))return refuseUserChange('Enter the subject identifier issued by the identity provider: lower-case letters, digits, dots, hyphens or underscores.');
      if(findUser(s))return refuseUserChange(`${s} already has an entry in ${app().name}. A person has one entry in an application.`);
      if(!n)return refuseUserChange('A display name is required.');
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e))return refuseUserChange('A valid email address is required.');
      if(roleId&&!model.roles.some(r=>r.id===roleId))return refuseUserChange(`${roleId} is not an application role of ${app().name}.`);
      return checkpoint('Added application user',()=>{model.users.push({subject:s,displayName:n,email:e,region:String(region||''),active:true,default:false,roles:roleId?[roleId]:[],overrides:[]});state.selectedUser=s;},userPath(s),'',`${n}; ${roleId?`holds ${roleId}`:'holds no application role yet'}; effective when ${app().name} is published`);
    }
    function setUserRole(subject,roleId,member){

      return setMember(userPath(subject),'roles',roleId,member);
    }
    function setUserOverride(subject,screenId,permissions,reason){
      const user=findUser(subject),s=model.screens.find(x=>x.id===screenId),keys=PERMISSIONS.filter(k=>permissions?.[k]===true),owner=foreignOwner(`screens.${screenId}`);
      if(!user)return false;

      if(keys.some(k=>(s.type==='action')!==(k==='execute')))return refuseUserChange('Execute applies to action screens only; the other permissions apply to data screens only.');
      if(!String(reason||'').trim())return refuseUserChange('A reason is required for an application user override.');
      return checkpoint('Set application user override',()=>{user.overrides=[...user.overrides.filter(o=>o.screenId!==screenId),{screenId,permissions:Object.fromEntries(keys.map(k=>[k,true])),reason:String(reason).trim()}];},userPath(subject),String(reason).trim(),`${screenId}: ${keys.join(', ')||'everything denied'} replaces the combined result of the application roles`);

    }

    // ---- rendering helpers: every model value is escaped, in text and in attributes ----------
    function controlId(path,prop){return 'c-'+hash(`${path}|${prop}`);}
    function optionList(options,value){
      const rows=options.map(o=>Array.isArray(o)?o:[o,o]),current=String(value??''),known=rows.some(o=>String(o[0])===current);
      return {known,html:(known?'':`<option value="${esc(current)}" selected>Unknown: ${esc(current)}</option>`)+rows.map(([v,l])=>`<option value="${esc(v)}"${String(v)===current?' selected':''}>${esc(l)}</option>`).join('')};
    }
    function control(path,prop,label,opts={}){
      const value=resolvePath(model,path)?.[prop],id=controlId(path,prop);
      const bind=`id="${id}" data-change="prop" data-path="${esc(path)}" data-prop="${esc(prop)}" data-kind="${esc(opts.kind||'')}" data-mutates${needsAttr(path)}`;
      const help=opts.help?`<div class="property-help">${esc(opts.help)}</div>`:'';
      if(opts.kind==='boolean')return `<label class="check"><input type="checkbox" ${bind}${value?' checked':''}> ${esc(label)}</label>`;
      let input;
      if(opts.options){const o=optionList(opts.options,value);input=`<select ${bind}${o.known?'':' aria-invalid="true"'}>${o.html}</select>`;}
      else if(opts.multiline)input=`<textarea ${bind}>${esc(value??'')}</textarea>`;

    }
    // A control that changes connections, application roles or application users says which Studio capability it needs.

    function pageLink(module,text){return `<button class="link" data-action="go" data-id="${esc(module)}">${esc(text)}</button>`;}
    function fixed(label,value){return `<div class="field"><label>${esc(label)}</label><input value="${esc(value)}" disabled aria-label="${esc(label)}"></div>`;}
    function flagBox(path,key,prop,label,checked,keep=false,disabled=false){
      return `<label class="check"><input type="checkbox" data-change="flag" data-path="${esc(path)}" data-key="${esc(key)}" data-prop="${esc(prop)}"${keep?' data-keep="1"':''} data-mutates${needsAttr(path)}${checked?' checked':''}${disabled?' disabled':''}> ${esc(label)}</label>`;
    }
    function checkGroup(path,prop,label,options){

      return `<fieldset class="field"><legend>${esc(label)}</legend>${options.map(o=>Array.isArray(o)?o:[o,o]).map(([v,l])=>`<label class="check"><input type="checkbox" data-change="member" data-path="${esc(path)}" data-prop="${esc(prop)}" data-value="${esc(v)}" data-mutates${needsAttr(path)}${current.includes(v)?' checked':''}> ${esc(l)}</label>`).join('')||'<span class="muted">Nothing to choose from.</span>'}</fieldset>`;
    }
    function tableEditor(path,columns,opts={}){
      const rows=resolvePath(model,path)||[],label=opts.label||'row',needs=needsAttr(path);
      const cell=(row,i,c)=>{
        const bind=`data-change="prop" data-path="${esc(`${path}.#${i}`)}" data-prop="${esc(c.key)}" data-kind="${esc(c.kind||'')}" data-mutates${needs} aria-label="${esc(c.label)}, ${esc(label)} ${i+1}"`,value=row[c.key];
        if(c.kind==='boolean')return `<input type="checkbox" ${bind}${value?' checked':''}>`;

    }
    function tabList(group,current,items,label){
      return `<div class="tabs" role="tablist" aria-label="${esc(label)}">${items.map(([id,text])=>`<button class="tab ${current===id?'active':''}" role="tab" id="tab-${esc(group)}-${esc(id)}" aria-selected="${current===id}" tabindex="${current===id?0:-1}" data-action="tab" data-group="${esc(group)}" data-id="${esc(id)}">${esc(text)}</button>`).join('')}</div>`;

    function link(path,text){return `<button class="link" data-action="open" data-path="${esc(path)}">${esc(text??entityName(path))}</button>`;}
    function chip(status){

    function emptyState(text,action,label,needs=''){return `<section class="panel"><div class="panel-body"><p>${esc(text)}</p><button class="button" data-action="${esc(action)}" data-mutates${needs?` data-needs="${esc(needs)}"`:''}>${esc(label)}</button></div></section>`;}

    function checklist(){
      const issues=validationIssues(),errors=issues.filter(i=>i.severity==='error').length,warnings=issues.filter(i=>i.severity==='warning'),approved=REVIEW_ROLES.filter(r=>state.approvals[r]).length;

        {label:'Warnings accepted under an approved rule',done:state.validated&&!blockingWarnings(issues).length,detail:`${warnings.length-blockingWarnings(issues).length} of ${warnings.length} accepted`},
        {label:'Independent approvals',done:approved===REVIEW_ROLES.length,detail:`${approved} of ${REVIEW_ROLES.length} recorded`},
        {label:'Publication reason',done:Boolean(state.publicationNote.trim()),detail:state.publicationNote.trim()?'Recorded':'Required'}

    // ---- preview data and renderers ---------------------------------------------------------------
    function fixtureRows(d){return structuredClone(fixtures.datasets[d.id]||[]);}
    function listLabel(listId,value){
      const v=model.valueLists.find(x=>x.id===listId);if(!v)return undefined;
      if(v.mode==='static')return (v.values||[]).find(x=>x.value===value)?.label;

    function previewValue(f,row){

      if(['date','datetime'].includes(f.type)&&(typeof value!=='string'||!/^\d{4}-\d{2}-\d{2}/.test(value)||Number.isNaN(Date.parse(value))))return 'Invalid date value';
      if(f.type==='currency')return new Intl.NumberFormat('en-GB',{style:'currency',currency:/^[A-Z]{3}\b/.test(f.format||'')?f.format.slice(0,3):'GBP',minimumFractionDigits:f.format?.includes('0.00')?2:0,maximumFractionDigits:2}).format(value);

    function screenCanvas(s,interactive=true){
      const viewer=previewSubject(s),master=dcFor(s),detail=model.dataClasses.find(d=>d.id===s.detailDataClassId),rows=master?fixtureRows(master):[];
      const denied=f=>viewer&&viewer.hiddenFields.includes(f.id);
      const shown=s.fields.filter(f=>f.visible&&f.type!=='hidden'&&!denied(f)),hidden=s.fields.filter(f=>f.type==='hidden'||!f.visible);
      const pick=f=>interactive?` data-action="select" data-kind="field" data-id="${esc(f.id)}"`:' tabindex="-1"',mark=f=>f.id===state.selectedField&&interactive?' active':'';
      const aside=f=>f.role==='criteria'||['label','action','subscreen'].includes(f.type),asideBlock=()=>shown.some(aside)?`<div class="section-title">Criteria and editor elements</div>${form(shown.filter(aside),null)}`:'';
      const head=f=>`<th scope="col" style="min-width:${Math.max(30,Number(f.width)||110)}px"><button type="button" class="preview-field${mark(f)}"${pick(f)}>${esc(f.caption)}${f.role==='criteria'?' <em>(criteria)</em>':''}</button></th>`;

      const box=(f,row)=>{
        const text=row?previewValue(f,row):f.default!==undefined?previewValue(f,{[f.binding]:f.default}):'';
        if(f.type==='label')return `<p class="preview-label">${esc(f.caption)}</p>`;
        if(f.type==='action')return `<span class="preview-button">${esc(f.caption)}</span>`;
        if(f.type==='subscreen')return `<div class="preview-input">${esc(text)}<span class="preview-affix">… opens ${esc(model.screens.find(x=>x.id===f.targetScreen)?.caption||'a screen')}</span></div>`;
        if(f.type==='boolean')return `<div class="preview-input">${text==='Yes'?'☑':'☐'} ${esc(text)}</div>`;

        return `<div class="preview-input${f.type==='textarea'?' tall':''}">${esc(text)}${affix?`<span class="preview-affix" aria-hidden="true">${affix}</span>`:''}</div>`;
      };
      const form=(fields,row)=>[...new Set(fields.map(f=>f.group))].map(g=>`<fieldset class="preview-group"><legend>${esc(g)}</legend><div class="preview-form">${fields.filter(f=>f.group===g).map(f=>`<div class="${f.wide?'wide':''}"><button type="button" class="preview-field${mark(f)}"${pick(f)}>${esc(f.caption)}${f.required?' *':''}${f.role==='criteria'?' <em>(criteria)</em>':''}</button>${box(f,row)}</div>`).join('')}</div></fieldset>`).join('');
      let body='';
      if(viewer&&!viewer.permissions.length)body=`<p class="notice bad">${esc(viewer.name)} is granted nothing on this screen (${esc(viewer.source)}). It is omitted from the definition delivered to them.</p>`;
      else if(s.type==='grid')body=asideBlock()+grid(shown.filter(f=>!aside(f)),rows);
      else if(s.type==='field')body=form(shown,rows[0]);
      else if(s.type==='action'){
        const result=rows[0]||{};

    document.getElementById('themeButton').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';setTheme(next);store('gd-admin-theme',next);};
    const sidebar=document.getElementById('sidebar'),mobileMenu=document.getElementById('mobileMenu'),media=matchMedia('(max-width:760px)');
    mobileMenu.onclick=()=>{sidebar.classList.toggle('open');mediaState();};
    function mediaState(){
      mobileMenu.classList.toggle('hidden',!media.matches);
      const hidden=media.matches&&!sidebar.classList.contains('open');
      if(hidden&&sidebar.contains(document.activeElement))mobileMenu.focus();
      sidebar.inert=hidden;mobileMenu.setAttribute('aria-expanded',String(!hidden));
    }
    media.addEventListener('change',mediaState);mediaState();

    // ---- deep links: #module=…&app=…&screen=…&tab=…&version=…&dialog=…&theme=… -------------------------
    function readRoute(){
      const params=new URLSearchParams(location.hash.replace(/^#/,'')),version=params.get('version'),alias={security:'approles',users:'appusers',administrators:'studiousers',applications:'application'},module=alias[params.get('module')]||params.get('module');
      if(lines[params.get('app')])switchApplication(params.get('app'));
      if(releases.some(v=>v.id===version)&&state.viewVersion!==version)selectVersion(version);
      if(titles[module])state.module=module;
      for(const [key,target] of [['screen','selectedScreen'],['field','selectedField'],['command','selectedCommand'],['dataclass','selectedDataClass'],['connection','selectedConnection'],['list','selectedList'],['report','selectedReport'],['role','selectedRole'],['user','selectedUser'],['admin','selectedAdmin'],['as','previewRole']])if(params.get(key))state[target]=params.get(key);
      if(administration.administrators.some(a=>a.name===params.get('actor')))state.actor=params.get('actor');
      const group={screens:'inspectorTab',dataclasses:'detailTab',approles:'securityTab',system:'systemTab'}[state.module];
      if(group&&params.get('tab'))state[group]=params.get('tab');
      if(params.get('theme'))setTheme(params.get('theme'));
      return params.get('dialog');
    }
    // The application and its version are part of the address only on the pages that depend on them.
    function writeRoute(){
      const parts=[`module=${state.module}`];
      if(applicationScoped()){
        parts.push(`app=${state.appId}`);
        if(state.module==='screens'&&state.selectedScreen)parts.push(`screen=${state.selectedScreen}`,`tab=${state.inspectorTab}`);
        if(state.module==='dataclasses'&&state.selectedDataClass)parts.push(`dataclass=${state.selectedDataClass}`,`tab=${state.detailTab}`);
        if(state.module==='approles'&&state.selectedRole)parts.push(`role=${state.selectedRole}`,`tab=${state.securityTab}`);
        if(state.module==='appusers'&&state.selectedUser)parts.push(`user=${state.selectedUser}`);
        if(state.viewVersion)parts.push(`version=${state.viewVersion}`);
      }
      if(state.module==='studiousers'&&state.selectedAdmin)parts.push(`admin=${state.selectedAdmin}`);
      try{history.replaceState(null,'','#'+parts.map(encodeURI).join('&'));}catch(error){/* some hosts forbid it for local files; deep links still load */}
    }
    function openRouteDialog(name){
      const firstWith=status=>releases.find(v=>v.status===status)?.id;
      if(name==='rollback'&&firstWith('Superseded'))rollbackTo(firstWith('Superseded'));
      if(name==='retire'&&releases.find(retirable))retireVersion((releases.find(v=>v.status==='Superseded')||releases.find(retirable)).id);
      if(name==='about')aboutPrototype();
      if(name==='json')showJson();
      if(name==='preview')previewScreen();
      if(name==='access')effectiveAccess();
      if(name==='useraccess')userEffectiveAccess(state.selectedUser);
      if(name==='approvegrant'&&pendingGrants()[0])grantDecisionDialog(pendingGrants()[0].admin.id,pendingGrants()[0].grant.id,true);
      if(name==='proposegrant')proposeGrantDialog(state.selectedAdmin);
      if(name==='selfchange'&&signedIn())proposeGrant(signedIn().id,'support-operator','Requested for my own record');
    }
    window.addEventListener('hashchange',()=>{const dialog=readRoute();render();openRouteDialog(dialog);});
    new ResizeObserver(syncTopbar).observe(document.querySelector('.topbar'));
    setTheme(stored('gd-admin-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
    const startDialog=readRoute();render();openRouteDialog(startDialog);
    setInterval(()=>tickSchedule(),1000);
  })();
  </script>
</body>
