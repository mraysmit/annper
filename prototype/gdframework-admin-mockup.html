<body>
  <a class="skip" href="#content">Skip to configuration workspace</a>
  <div id="app">
    <header class="topbar">
      <button class="icon-btn hidden" id="mobileMenu" aria-label="Open administration navigation">☰</button>
      <div class="brand"><div class="brand-mark">GD</div><div><strong>GD Studio</strong><small>Metadata administration</small></div></div>
      <div class="environment">UAT environment</div>
      <div class="context app-context"><label for="applicationSelect">Application</label><select class="select" id="applicationSelect"></select></div>
      <div class="context version"><label for="versionSelect">Version</label><select class="select" id="versionSelect"><option>Draft 2026.09.2</option><option>Published 2026.09.1</option><option>Published 2026.08.4</option></select></div>
      <div class="spacer"></div><span class="change-chip" id="changeChip">● 0 draft changes</span>
      <button class="top-action" id="undoButton" disabled title="Undo last change">↶ <span>Undo</span></button>
      <button class="top-action" id="jsonButton" title="View configuration JSON">{ } <span>JSON</span></button>
      <button class="top-action" id="validateButton">✓ <span>Validate</span></button>
      <button class="top-action" id="previewButton">▷ <span>Preview</span></button>
      <button class="top-action primary" id="publishButton">↑ <span>Publish</span></button>
      <button class="icon-btn" id="themeButton" aria-label="Toggle theme">◐</button><span class="avatar" title="Jordan Lee — Configurator">JL</span>
    </header>

    <div class="shell">

    function renderReports(){const reports=model.reports.filter(r=>r.appId===state.appId);if(!reports.some(r=>r.id===state.selectedReport))state.selectedReport=reports[0]?.id;const r=model.reports.find(x=>x.id===state.selectedReport);if(!r){host.innerHTML='<div class="panel"><div class="panel-body muted">No reports configured for this application. Use Add report to create one.</div></div>';return}host.innerHTML=`<div class="split-layout"><section class="panel list-panel"><div class="panel-head"><h2>Reports</h2><span class="status info">${reports.length}</span></div>${reports.map(x=>`<button class="list-row ${x.id===state.selectedReport?'active':''}" data-select-report="${x.id}"><strong>${esc(x.name)}</strong><small>${esc(x.type)} · ${esc(x.dataClassId)} · ${x.outputs.join(', ')}</small></button>`).join('')}</section><section class="panel detail-panel"><div class="panel-head"><h2>${esc(r.name)}</h2><button class="button small right" data-preview-report>▷ Preview</button></div><div class="panel-body"><div class="form-grid"><div class="field"><label>Stable report ID</label><input value="${esc(r.id)}" disabled></div><div class="field"><label>Display name</label><input data-report-prop="name" value="${esc(r.name)}"></div><div class="field"><label>Report type</label><select data-report-prop="type"><option value="tabular" ${r.type==='tabular'?'selected':''}>Tabular</option><option value="chart-and-table" ${r.type==='chart-and-table'?'selected':''}>Chart and table</option><option value="cross-tab" ${r.type==='cross-tab'?'selected':''}>Cross-tab</option></select></div><div class="field"><label>Source DataClass</label><select data-report-prop="dataClassId">${model.dataClasses.filter(d=>d.appId===state.appId).map(d=>`<option value="${d.id}" ${r.dataClassId===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select></div><div class="field"><label>Page orientation</label><select data-report-prop="orientation"><option ${r.orientation==='portrait'?'selected':''}>portrait</o     function renderSecurity(){const screens=model.screens.filter(s=>s.appId===state.appId),roles=model.roles.filter(r=>Object.keys(r.permissions).some(id=>screens.some(s=>s.id===id)));if(!roles.some(r=>r.id===state.selectedRole))state.selectedRole=roles[0]?.id;const role=model.roles.find(r=>r.id===state.selectedRole),letters=['R','W','I','D','E','P'],labels=['Read','Write','Insert','Delete','Export','Print'];host.innerHTML=`<div class="toolbar"><div class="role-tabs">${roles.map(r=>`<button class="role-pill ${r.id===state.selectedRole?'active':''}" data-role="${r.id}">${esc(r.name)} · ${r.members}</button>`).join('')}</div><span class="right"><button class="button" data-effective-access>◉ Preview effective access</button></span></div><section class="panel"><div class="panel-head"><h2>${esc(role.name)} permissions</h2><p class="right">${role.members} assigned users · Server-enforced policies</p></div><div class="permission-wrap"><table class="permission"><thead><tr><th>Screen</th>${labels.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${screens.map(s=>{const p=role.permissions[s.id]||'------';return `<tr><td><strong>${esc(s.caption)}</strong><br><span class="muted">${esc(s.id)}</span></td>${letters.map((l,i)=>`<td><input type="checkbox" data-permission="${s.id}:${i}" aria-label="${labels[i]} ${esc(s.caption)}" ${p[i]===l?'checked':''}></td>`).join('')}</tr>`}).join('')}</tbody></table></div></section><div class="panel" style="margin-top:12px"><div class="panel-head"><h2>Security rules</h2></div><div class="panel-body"><div class="form-grid"><div class="relation-box"><strong>Definition filtering</strong><br><span class="muted">Unauthorized screens, fields and commands are omitted from delivered metadata.</span></div><div class="relation-box"><strong>Execution enforcement</strong><br><span class="muted">Every query, change, action, report and admin operation rechecks policy server-side.</span></div></div></div></div>`}
    function validationIssues(){const issues=[];const s=model.screens.find(x=>x.id==='orders');if(s.fields.some(f=>f.id==='amount'&&!f.format))issues.push({severity:'error',code:'FIELD_FORMAT_REQUIRED',path:'screens.orders.fields.amount',text:'Currency field requires an explicit display and export format.'});if(model.connections.some(c=>c.health==='Warning'))issues.push({severity:'warning',code:'PROVIDER_HEALTH_WARNING',path:'connections.risk-db',text:'Risk Database health check reports degraded response time.'});issues.push({severity:'warning',code:'UNUSED_VALUE_LIST',path:'valueLists.segments',text:'Customer segments is referenced only by a field not present in the initial navigation path.'});issues.push({severity:'info',code:'ACCESS_IMPACT',path:'roles.operations-editor',text:'Export permission change affects 18 effective users.'});return issues}

      if(e.target.closest('[data-manage-commands]')){const s=screen(),rows=[...s.commands,{key:'',label:'',policy:''}];showModal(`Manage commands — ${s.caption}`,`<p class="muted">Commands become runtime toolbar actions. Keys are stable; policies are enforced again by the API.</p><table class="data-grid"><thead><tr><th>Stable key</th><th>Caption</th><th>Required policy</th><th>Remove</th></tr></thead><tbody>${rows.map((c,i)=>`<tr data-command-row><td><input data-command-key value="${esc(c.key)}" placeholder="e.g. approve" ${i<s.commands.length?'readonly':''} style="border:1px solid var(--line);border-radius:5px;padding:7px;width:100%"></td><td><input data-command-label value="${esc(c.label)}" placeholder="Caption" style="border:1px solid var(--line);border-radius:5px;padding:7px;width:100%"></td><td><input data-command-policy-edit value="${esc(c.policy)}" placeholder="resource.action" style="border:1px solid var(--line);border-radius:5px;padding:7px;width:100%"></td><td style="text-align:center"><input type="checkbox" data-command-remove ${i===s.commands.length?'disabled':''} aria-label="Remove command"></td></tr>`).join('')}</tbody></table><p class="property-help">The final blank row adds one command. Reopen this editor to add more.</p>`,[{label:'Cancel',action:closeModal},{label:'Save commands',primary:true,action:()=>{const next=[...document.querySelectorAll('[data-command-row]')].map(row=>({key:row.querySelector('[data-command-key]').value.trim(),label:row.querySelector('[data-command-label]').value.trim(),policy:row.querySelector('[data-command-policy-edit]').value.trim(),remove:row.querySelector('[data-command-remove]').checked})).filter(c=>c.key&&!c.remove);if(next.some(c=>!c.label||!c.policy))return toast('Every command needs a caption and policy','warn');if(new Set(next.map(c=>c.key)).size!==next.length)return toast('Command keys must be unique','warn');closeModal();checkpoint('Updated screen commands',()=>s.commands=next)}}]);return}

      const a=e.target.closest('[data-select-app]');if(a){state.appId=a.dataset.selectApp;state.selectedScreen=model.screens.find(s=>s.appId===state.appId)?.id;state.selectedDataClass=model.dataClasses.find(d=>d.appId===state.appId)?.id;render();updateChrome();return}

      const dv=e.target.closest('[data-delete-value]');if(dv){checkpoint('Deleted value-list item',()=>list().values.splice(Number(dv.dataset.deleteValue),1));return}if(e.target.closest('[data-add-value]')){checkpoint('Added value-list item',()=>list().values.push({value:'New',label:'New value',active:true}));return}
      const issue=e.target.closest('[data-fix-issue]');if(issue){if(issue.dataset.fixIssue==='FIELD_FORMAT_REQUIRED'){state.module='screens';state.appId='ops';state.selectedScreen='orders';state.selectedField='amount';state.inspectorTab='properties';render()}else if(issue.dataset.fixIssue==='PROVIDER_HEALTH_WARNING'){state.module='connections';state.selectedConnection='risk-db';render()}else{state.module='values';state.selectedList='segments';render()}return}
      const rollback=e.target.closest('[data-rollback]');if(rollback){showModal('Create rollback publication',`<p>This creates a new immutable version using the configuration from <strong>${esc(model.versions.find(v=>v.id===rollback.dataset.rollback).label)}</strong>. It does not rewrite history.</p><label class="check"><input id="rollbackConfirm" type="checkbox"> I understand this will require validation and approval.</label>`,[{label:'Cancel',action:closeModal},{label:'Create draft',primary:true,action:()=>{if(!document.getElementById('rollbackConfirm').checked)return toast('Confirm rollback intent','warn');closeModal();state.dirty++;updateChrome();toast('Rollback draft created')}}]);return}
      if(e.target.closest('[data-effective-access]')){const role=model.roles.find(r=>r.id===state.selectedRole);showModal('Effective access preview',`<h3>${esc(role.name)}</h3><p>Representative subject: <strong>alex.smith@example.test</strong></p>${model.screens.filter(s=>s.appId===state.appId).map(s=>{const p=role.permissions[s.id]||'------';return `<div class="detail-kv"><strong>${esc(s.caption)}</strong><span>${p==='------'?'Hidden':`Read ${p[0]==='R'?'yes':'no'} · Write ${p[1]==='W'?'yes':'no'} · Export ${p[4]==='E'?'yes':'no'}`}</span></div>`}).join('')}<p class="muted">The runtime API independently rechecks these permissions.</p>`,[{label:'Close',primary:true,action:closeModal}]);return}
      if(e.target.closest('[data-close-modal]')||e.target===modal){closeModal();return}
    });
    document.addEventListener('change',e=>{
      if(e.target.id==='applicationSelect'){state.appId=e.target.value;state.selectedScreen=model.screens.find(s=>s.appId===state.appId)?.id;state.selectedDataClass=model.dataClasses.find(d=>d.appId===state.appId)?.id;render();updateChrome();return}
      if(e.target.matches('[data-app-prop]')){const p=e.target.dataset.appProp;checkpoint('Updated application',()=>app()[p]=valueOf(e.target));return}if(e.target.matches('[data-app-option]')){checkpoint('Updated application option',()=>app().options[e.target.dataset.appOption]=e.target.checked);return}
      if(e.target.matches('[data-screen-prop]')){const p=e.target.dataset.screenProp;checkpoint('Updated screen',()=>screen()[p]=valueOf(e.target));return}if(e.target.matches('[data-capability]')){checkpoint('Updated screen capability',()=>screen().capabilities[e.target.dataset.capability]=e.target.checked);return}
      if(e.target.matches('[data-field-prop]')){const f=screen().fields.find(x=>x.id===state.selectedField),p=e.target.dataset.fieldProp;checkpoint('Updated field',()=>f[p]=valueOf(e.target));return}if(e.target.matches('[data-command-policy]')){const c=screen().commands.find(x=>x.key===e.target.dataset.commandPolicy);checkpoint('Updated command policy',()=>c.policy=e.target.value);return}
      if(e.target.matches('[data-dc-prop]')){const p=e.target.dataset.dcProp;checkpoint('Updated DataClass',()=>dc()[p]=valueOf(e.target));return}if(e.target.matches('[data-dc-array]')){checkpoint('Updated DataClass key',()=>dc()[e.target.dataset.dcArray]=e.target.value.split(',').map(x=>x.trim()).filter(Boolean));return}
      if(e.target.matches('[data-list-prop]')){const p=e.target.dataset.listProp;checkpoint('Updated value list',()=>list()[p]=valueOf(e.target));return}if(e.target.matches('[data-value-prop]')){const [i,p]=e.target.dataset.valueProp.split(':');checkpoint('Updated value-list item',()=>list().values[Number(i)][p]=valueOf(e.target));return}
      if(e.target.matches('[data-report-prop]')){const r=model.reports.find(x=>x.id===state.selectedReport),p=e.target.dataset.reportProp;checkpoint('Updated report',()=>r[p]=valueOf(e.target));return}
      if(e.target.matches('[data-report-output]')){const r=model.reports.find(x=>x.id===state.selectedReport),output=e.target.dataset.reportOutput;checkpoint('Updated report output',()=>{r.outputs=e.target.checked?[...new Set([...r.outputs,output])]:r.outputs.filter(x=>x!==output)});return}
      if(e.target.matches('[data-report-column]')){const r=model.reports.find(x=>x.id===state.selectedReport),[i,p]=e.target.dataset.reportColumn.split(':');checkpoint('Updated report column',()=>r.columns[Number(i)][p]=e.target.value);return}
      if(e.target.matches('[data-permission]')){const [sid,i]=e.target.dataset.permission.split(':'),role=model.roles.find(r=>r.id===state.selectedRole),letters=['R','W','I','D','E','P'],chars=(role.permissions[sid]||'------').split('');checkpoint('Updated role permission',()=>{chars[Number(i)]=e.target.checked?letters[Number(i)]:'-';role.permissions[sid]=chars.join('')});return}
      if(e.target.matches('[data-nav-prop]')){const [type,gid,iid]=e.target.dataset.navTarget.split(':'),g=model.navigation[state.appId].find(x=>x.id===gid),target=type==='group'?g:g.items.find(x=>x.id===iid);checkpoint('Updated navigation',()=>target[e.target.dataset.navProp]=e.target.value);return}
    });
    document.addEventListener('input',e=>{if(e.target.matches('[data-screen-search]')){const q=e.target.value.toLowerCase();document.querySelectorAll('[data-select-screen]').forEach(x=>x.classList.toggle('hidden',!x.textContent.toLowerCase().includes(q)))}if(e.target.matches('[data-dc-search]')){const q=e.target.value.toLowerCase();document.querySelectorAll('[data-select-dc]').forEach(x=>x.classList.toggle('hidden',!x.textContent.toLowerCase().includes(q)))}if(e.target.matches('[data-audit-search]')){const q=e.target.value.toLowerCase();document.querySelectorAll('#auditRows tr').forEach(x=>x.classList.toggle('hidden',!x.textContent.toLowerCase().includes(q)))}});
    document.getElementById('undoButton').onclick=()=>{if(!state.history.length)return;state.future.push(JSON.stringify(model));const prev=JSON.parse(state.history.pop());Object.keys(model).forEach(k=>delete model[k]);Object.assign(model,prev);state.dirty=Math.max(0,state.dirty-1);state.validated=false;updateChrome();render();toast('Last change undone')};
    document.getElementById('jsonButton').onclick=()=>showModal('Draft configuration JSON',`<div class="toolbar"><button class="button small" id="downloadJson">⇩ Download JSON</button><label class="button small" for="importJson">⇧ Import JSON</label><input id="importJson" type="file" accept="application/json" class="hidden"></div><pre class="json">${esc(JSON.stringify(model,null,2))}</pre>`,[{label:'Close',action:closeModal}]);
    document.getElementById('modalBody').addEventListener('click',e=>{if(e.target.id==='downloadJson'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(model,null,2)],{type:'application/json'}));a.download='gd-metadata-draft-2026.09.2.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('Draft JSON downloaded')}});
    document.getElementById('modalBody').addEventListener('change',e=>{if(e.target.id==='importJson'){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);closeModal();checkpoint('Imported JSON draft',()=>{Object.keys(model).forEach(k=>delete model[k]);Object.assign(model,data)});toast('JSON imported and marked for validation')}catch{toast('JSON file is not valid','warn')}};r.readAsText(file)}});
    document.getElementById('versionSelect').onchange=e=>{state.module='versions';render();toast(e.target.value.startsWith('Draft')?'Draft configuration selected':`${e.target.value} opened as an immutable snapshot`)};
    document.getElementById('validateButton').onclick=runValidation;document.getElementById('previewButton').onclick=preview;document.getElementById('publishButton').onclick=publish;document.getElementById('themeButton').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('gd-admin-theme',t)};
    document.getElementById('mobileMenu').onclick=()=>document.getElementById('sidebar').classList.toggle('open');const media=matchMedia('(max-width:760px)');function mediaState(){document.getElementById('mobileMenu').classList.toggle('hidden',!media.matches)}media.addEventListener('change',mediaState);mediaState();
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modal.classList.contains('open'))closeModal();else document.getElementById('sidebar').classList.remove('open')}});
    document.getElementById('applicationSelect').innerHTML=model.applications.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('');const savedTheme=localStorage.getItem('gd-admin-theme');if(savedTheme)document.documentElement.dataset.theme=savedTheme;render();updateChrome();
  })();
  </script>
</body>
</html>
